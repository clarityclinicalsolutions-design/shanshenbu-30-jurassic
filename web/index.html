<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>《闪身步30招：九宫格多世界大乱斗》 — 恐龙 / 丧尸 / 木乃伊 + 中文语音喊招</title>
  <style>
    :root {
      --gold: #f59e0b;
      --cyan: #38bdf8;
      --crimson: #ef4444;
      --emerald: #10b981;
      --bg-card: rgba(12, 10, 14, 0.88);
      --border-gold: rgba(245, 158, 11, 0.52);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
    body, html {
      width: 100%; height: 100%; overflow: hidden;
      background: #09090b; color: #fafaf9;
      font-family: 'Microsoft YaHei', 'Segoe UI', system-ui, sans-serif;
    }
    #game-canvas {
      position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none;
    }

    /* Top HUD Bar */
    .hud-top {
      position: absolute; top: 8px; left: 8px; right: 8px;
      display: flex; justify-content: space-between; align-items: flex-start;
      pointer-events: none; z-index: 15; gap: 8px;
    }
    .hud-card {
      background: var(--bg-card); backdrop-filter: blur(10px);
      border: 1px solid var(--border-gold); border-radius: 12px;
      padding: 8px 11px; pointer-events: auto;
      box-shadow: 0 8px 26px rgba(0, 0, 0, 0.7);
    }
    .title-line {
      display: flex; align-items: center; gap: 6px; font-size: 13.5px; font-weight: 900; color: var(--gold);
    }
    .badge-v2 {
      font-size: 10px; padding: 1px 7px; border-radius: 99px;
      background: rgba(56, 189, 248, 0.22); color: #7dd3fc; border: 1px solid rgba(56,189,248,0.45);
    }
    .bars-box { margin-top: 5px; display: flex; flex-direction: column; gap: 4px; min-width: 215px; }
    .bar-row { display: flex; align-items: center; gap: 6px; font-size: 10.5px; font-weight: 700; }
    .bar-bg { flex: 1; height: 8px; background: rgba(255,255,255,0.14); border-radius: 99px; overflow: hidden; }
    .bar-fg { height: 100%; transition: width 0.14s; border-radius: 99px; }
    .hp-fg { background: linear-gradient(90deg, #dc2626, #f59e0b); width: 100%; }
    .qi-fg { background: linear-gradient(90deg, #0ea5e9, #c084fc); width: 50%; }
    .stats-row {
      display: grid; grid-template-columns: repeat(4, auto); gap: 10px;
      margin-top: 5px; font-size: 10.5px;
    }
    .st-cell span { font-size: 9px; color: #a8a29e; display: block; }
    .st-cell strong { font-size: 12.5px; color: #fff; }

    /* Right Control Workshop: World / Enemy / Voice / Comedy Music / Mode Switch */
    .hud-right {
      width: 286px; display: flex; flex-direction: column; gap: 5px;
    }
    .panel-head {
      display: flex; justify-content: space-between; align-items: center;
      font-size: 11px; font-weight: 800; color: var(--gold);
    }
    .ctrl-row {
      display: flex; align-items: center; gap: 5px; font-size: 10.5px;
    }
    .ctrl-row label { width: 52px; color: #d6d3d1; font-weight: 700; flex-shrink: 0; }
    .ctrl-select {
      flex: 1; background: rgba(28, 25, 23, 0.96); color: #fef3c7;
      border: 1px solid rgba(245, 158, 11, 0.4); border-radius: 6px;
      padding: 3px 6px; font-size: 10.5px; font-weight: 700; outline: none; cursor: pointer;
    }
    .btn-grid-2 {
      display: grid; grid-template-columns: 1fr 1fr; gap: 4px; margin-top: 2px;
    }
    .c-btn {
      padding: 4px 6px; font-size: 10px; font-weight: 700;
      border-radius: 6px; border: 1px solid rgba(245, 158, 11, 0.38);
      background: rgba(255, 255, 255, 0.08); color: #fef3c7; cursor: pointer;
      transition: all 0.14s; text-align: center; white-space: nowrap; text-decoration: none;
      display: inline-flex; align-items: center; justify-content: center;
    }
    .c-btn:hover, .c-btn.active {
      background: var(--gold); color: #0c0a09; border-color: #fff;
    }

    /* Bottom Dock: Dodge vs Attack Quick Controls + 30 Moves Wheel */
    .moves-dock {
      position: absolute; bottom: 6px; left: 8px; right: 8px; z-index: 15;
      background: var(--bg-card); backdrop-filter: blur(12px);
      border: 1px solid var(--border-gold); border-radius: 11px;
      padding: 6px 9px; pointer-events: auto;
    }
    .dock-header {
      display: flex; justify-content: space-between; align-items: center;
      flex-wrap: wrap; gap: 5px; margin-bottom: 5px;
    }
    .stance-tabs { display: flex; gap: 4px; flex-wrap: wrap; }
    .stance-tab {
      padding: 2px 8px; border-radius: 99px; font-size: 10px; font-weight: 700;
      background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.16);
      color: #e7e5e4; cursor: pointer;
    }
    .stance-tab.active { background: var(--gold); color: #0c0a09; border-color: #fff; }
    .moves-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(134px, 1fr));
      gap: 4px; max-height: 70px; overflow-y: auto; padding-right: 4px;
    }
    .move-card {
      background: rgba(24, 24, 27, 0.94);
      border: 1px solid rgba(245, 158, 11, 0.3);
      border-radius: 6px; padding: 4px 6px; cursor: pointer; transition: all 0.12s;
    }
    .move-card.is-dodge { border-color: rgba(56, 189, 248, 0.45); }
    .move-card.is-dodge .m-name { color: #7dd3fc; }
    .move-card:hover { transform: translateY(-1px); background: rgba(245, 158, 11, 0.22); }
    .move-card.active-move {
      border-color: #fff; box-shadow: 0 0 12px rgba(245, 158, 11, 0.65);
      background: rgba(245, 158, 11, 0.3);
    }
    .move-card .m-name { font-size: 10.5px; font-weight: 800; color: #fef08a; }
    .move-card .m-meta {
      font-size: 9px; color: #a8a29e; display: flex; justify-content: space-between; margin-top: 1px;
    }

    /* Mobile / Touch Floating D-Pad + Dodge/Attack Circle Buttons */
    .touch-overlay {
      position: absolute; bottom: 112px; left: 12px; right: 12px;
      display: flex; justify-content: space-between; align-items: flex-end;
      pointer-events: none; z-index: 16;
    }
    .dpad-grid {
      display: grid; grid-template-columns: repeat(3, 42px); grid-template-rows: repeat(3, 42px);
      gap: 4px; pointer-events: auto;
    }
    .dpad-btn {
      border-radius: 8px; border: 1px solid rgba(245, 158, 11, 0.55);
      background: rgba(15, 23, 42, 0.72); color: #fef08a; font-size: 16px; font-weight: 900;
      cursor: pointer; touch-action: manipulation;
    }
    .dpad-btn:active { background: var(--gold); color: #000; }
    .action-circles {
      display: flex; gap: 8px; align-items: flex-end; pointer-events: auto;
    }
    .act-btn {
      width: 66px; height: 66px; border-radius: 50%; border: 2.5px solid #fff;
      font-weight: 900; font-size: 12px; cursor: pointer;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.7); touch-action: manipulation;
    }
    .act-btn small { font-size: 8.5px; font-weight: 700; opacity: 0.92; }
    .act-dodge { background: linear-gradient(135deg, #38bdf8, #0284c7); color: #fff; width: 72px; height: 72px; }
    .act-kick { background: linear-gradient(135deg, #fef08a, #f59e0b); color: #0c0a09; }
    .act-ult { background: linear-gradient(135deg, #fca5a5, #dc2626); color: #fff; width: 58px; height: 58px; }

    body.hud-collapsed .hud-right .ctrl-row,
    body.hud-collapsed .hud-right .btn-grid-2,
    body.hud-collapsed .moves-dock .moves-grid { display: none !important; }

    @media (max-width: 960px), (max-height: 600px) {
      .hud-top > .hud-card:first-child { transform: scale(0.78); transform-origin: top left; }
      .hud-right { transform: scale(0.76); transform-origin: top right; }
      .moves-grid { max-height: 48px; }
      .dpad-grid { transform: scale(0.86); transform-origin: bottom left; }
      .action-circles { transform: scale(0.86); transform-origin: bottom right; }
    }
  </style>
</head>
<body>
  <canvas id="game-canvas"></canvas>

  <!-- Top HUD -->
  <div class="hud-top">
    <div class="hud-card">
      <div class="title-line">
        <span>🕺 《闪身步30招：九宫格大乱斗》</span>
        <span class="badge-v2">v2.0 九宫格多世界版</span>
      </div>
      <div style="font-size:10px;color:#d6d3d1;margin-top:2px;">
        WASD/点格子切位 | <strong style="color:#38bdf8;">Space: 01.闪身步(纯躲避+回气)</strong> | <strong style="color:#f59e0b;">J: 02.浪子踢球(攻击)</strong>
      </div>
      <div class="bars-box">

        if (!this.ctx) return;
        const now = this.ctx.currentTime;

        osc.connect(g); g.connect(this.ctx.destination);
        osc.start(now); osc.stop(now + dur);

        osc.connect(g); g.connect(this.ctx.destination);
        osc.start(now); osc.stop(now + dur);

    // Hero on 3x3 Grid: col (0=左, 1=中, 2=右), row (0=上, 1=中, 2=下)
    const hero = {
      col: 1, row: 1,

    const enemies = [];

    // Compute responsive 3x3 Grid bounding rectangle centered in screen with clear top headroom
    function getGridRect() {
      const w = canvas.width;
      const h = canvas.height;
      const availH = Math.max(210, h - 270);
      const availW = Math.max(260, w - 160);
      const gridW = Math.min(540, availW * 0.72);
      const gridH = Math.min(330, availH * 0.84);
      const x = (w - gridW) * 0.5;
      const y = Math.max(138, (h - 110 - gridH) * 0.58);
      return { x, y, w: gridW, h: gridH, cellW: gridW / 3, cellH: gridH / 3 };
    }

    function cellCenter(col, row) {
      const g = getGridRect();
      return {
        x: g.x + (col + 0.5) * g.cellW,
        y: g.y + (row + 0.5) * g.cellH,
      };
    }

    // Initialize Hero position to center tile (1, 1)
    const initC = cellCenter(1, 1);
    hero.px = initC.x;
    hero.py = initC.y;

    // Move hero on 3x3 grid
    function moveHeroGrid(dCol, dRow) {
      const nCol = Math.max(0, Math.min(2, hero.col + dCol));
      const nRow = Math.max(0, Math.min(2, hero.row + dRow));
      if (dCol !== 0) hero.facing = dCol > 0 ? 1 : -1;
      if (nCol !== hero.col || nRow !== hero.row) {
        hero.col = nCol;
        hero.row = nRow;
      }
    }

    // Check if a tile (c, r) currently has a red incoming warning
    function isCellDangerous(c, r) {
      return enemies.some(e => e.alive && !e.kicked && e.targetCells.some(tc => tc.c === c && tc.r === r));
    }

    // Find safest adjacent tile when player presses 闪身步 (Space / Dodge)
    function findSafeTile() {
      const candidates = [];
      for (let r = 0; r < 3; r++) {
        for (let c = 0; c < 3; c++) {
          if (c === hero.col && r === hero.row) continue;
          const danger = isCellDangerous(c, r);
          const dist = Math.abs(c - hero.col) + Math.abs(r - hero.row);
          candidates.push({ c, r, danger, dist });
        }
      }
      candidates.sort((a, b) => (a.danger - b.danger) || (a.dist - b.dist));
      return candidates[0] || { c: (hero.col + 1) % 3, r: hero.row };
    }

    function pickEnemyTemplate() {

    function spawnEnemyWave() {
      // Fairness Guard: always leave safe cells on the 3x3 grid so every attack is dodgeable with Shanshenbu!
      let dangerCount = 0;
      for (let rr = 0; rr < 3; rr++) {
        for (let cc = 0; cc < 3; cc++) {
          if (isCellDangerous(cc, rr)) dangerCount++;
        }
      }
      if (dangerCount >= 5) return;

      const g = getGridRect();
      const tpl = pickEnemyTemplate();

      // Choose direction: Top->Down (vertical column), Left->Right (row), Right->Left (row), or Aerial Dive (target tile)!
      const dirs = tpl.isAir ? ['aerial', 'top_down', 'left_right', 'right_left'] : ['top_down', 'top_down', 'left_right', 'right_left'];
      const dir = dirs[Math.floor(Math.random() * dirs.length)];
      const col = Math.floor(Math.random() * 3);
      const row = Math.floor(Math.random() * 3);

      let startX, startY, endX, endY, facing = 1;
      const targetCells = [];

      if (dir === 'top_down') {
        const topC = cellCenter(col, 0);
        const botC = cellCenter(col, 2);
        startX = topC.x;
        startY = -80;
        endX = botC.x;
        endY = canvas.height + 100;
        facing = col <= 1 ? 1 : -1;
        for (let r = 0; r < 3; r++) targetCells.push({ c: col, r });
      } else if (dir === 'left_right') {
        const leftC = cellCenter(0, row);
        startX = -110;
        startY = leftC.y;
        endX = canvas.width + 110;
        endY = leftC.y;
        facing = 1;
        for (let c = 0; c < 3; c++) targetCells.push({ c, r: row });
      } else if (dir === 'right_left') {
        const rightC = cellCenter(2, row);
        startX = canvas.width + 110;
        startY = rightC.y;
        endX = -110;
        endY = rightC.y;
        facing = -1;
        for (let c = 0; c < 3; c++) targetCells.push({ c, r: row });
      } else {
        // Aerial swoop diagonal toward a specific grid cell!
        const tc = cellCenter(col, row);
        const fromL = Math.random() < 0.5;
        startX = fromL ? -100 : canvas.width + 100;
        startY = -70;
        endX = fromL ? canvas.width + 100 : -100;
        endY = tc.y + 180;
        facing = fromL ? 1 : -1;
        targetCells.push({ c: col, r: row });
      }

      enemies.push({
        ...tpl,
        maxHp: tpl.hp,
        dir,
        targetCol: col,
        targetRow: row,
        targetCells,
        x: startX,
        y: startY,
        startX, startY, endX, endY,
        facing,
        telegraphTimer: 0.95, // 0.95s red grid warning before rushing!
        progress: 0,
        speed: tpl.isAir ? 0.68 : (tpl.isBoss ? 0.42 : 0.58),
        alive: true,
        hitPlayer: false,
        kicked: false,
        kickVx: 0, kickVy: 0, rot: 0, vRot: 0,
        hitFlash: 0,
      });
    }

    // =========================================================================
    // 7. EXECUTE ANY OF THE 30 MOVES (STRICT PURE DODGE vs COUNTER ATTACK!)
    // =========================================================================
    function executeMove(moveId) {
      const move = MOVES_30.find(m => m.id === moveId) || MOVES_30[0];

      // Check Qi cost for ultimate attacks
      if (move.qiCost > 0 && state.qi < move.qiCost) {
        floatingTexts.push({ x: hero.px, y: hero.py - 80, text: `气力不足！(快用【闪身步】躲避回气)`, color: '#38bdf8', life: 1.0 });
        return;
      }
      state.qi = Math.max(0, state.qi - move.qiCost);

      // Highlight card
      document.querySelectorAll('.move-card').forEach(c => c.classList.remove('active-move'));
      const card = document.getElementById('move-card-' + move.id);
      if (card) card.classList.add('active-move');

      // -----------------------------------------------------------------------
      // CASE A: PURE DODGE MOVES (闪身步 / 野鸡溜 / 拔泥步 ... ZERO ATTACK DAMAGE!)
      // -----------------------------------------------------------------------
      if (move.kind === 'dodge') {
        const wasInDanger = isCellDangerous(hero.col, hero.row);

        // Spawn 3 cyan glowing afterimages at old position before zipping!
        for (let i = 0; i < 3; i++) {
          hero.afterimages.push({
            x: hero.px - i * 16 * hero.facing,
            y: hero.py,
            facing: hero.facing,
            pose: 'dodge',
            life: 0.48 - i * 0.09,
          });
        }

        // Auto-sidestep to the safest adjacent grid tile!
        const safe = findSafeTile();
        if (safe.c !== hero.col) hero.facing = safe.c > hero.col ? 1 : -1;
        hero.col = safe.c;
        hero.row = safe.r;
        hero.pose = 'dodge';
        hero.poseTimer = 0.52;
        hero.iframeTimer = Math.max(hero.iframeTimer, move.iframe);

        if (move.id === 22) state.witchTimeTimer = 2.0; // 太极领域缓速

        if (wasInDanger) {
          // PERFECT DODGE REWARD!
          state.perfectDodges++;
          state.qi = Math.min(state.maxQi, state.qi + 25);
          state.score += 150;
          state.witchTimeTimer = Math.max(state.witchTimeTimer, 0.85);
          music.playSFX('perfect');
          const taunt = DODGE_TAUNTS[state.perfectDodges % DODGE_TAUNTS.length];
          speakChineseCallout(move.id === 1 ? taunt : move.voice, true);
          state.bannerText = `⚡ 极限闪身 · ${move.name}（纯躲避成功！）⚡`;
          state.bannerSub = `完美避开危险红格！气力 +25 · 得分 +150（闪身步不造成攻击，可趁机接【浪子踢球】反击！）`;
          floatingTexts.push({ x: hero.px, y: hero.py - 85, text: '⚡ 极限闪身！+25气力', color: '#38bdf8', life: 1.1 });
        } else {
          music.playSFX('dodge');
          speakChineseCallout(move.voice, false);
          state.bannerText = `💨 【${move.name}】`;
          state.bannerSub = move.desc;
        }
        state.bannerKind = 'dodge';
        state.bannerTimer = 1.5;
        return; // STRICTLY ZERO DAMAGE!
      }

      // -----------------------------------------------------------------------
      // CASE B: ATTACK MOVES (浪子踢球 / 狗熊哆嗦毛 / 铁山靠 / 三十路万象归宗)
      // -----------------------------------------------------------------------
      hero.pose = 'kick';
      hero.poseTimer = 0.52;
      hero.iframeTimer = Math.max(hero.iframeTimer, move.iframe);
      music.playSFX('kick');
      speakChineseCallout(move.voice, move.id >= 21);

      if (move.id === 20) {
        state.hp = Math.min(state.maxHp, state.hp + 30);
      }

      // Move #30 fills ALL 9 Grid tiles with Black Tank-Top Master clones!
      if (move.id === 30) {
        for (let r = 0; r < 3; r++) {
          for (let c = 0; c < 3; c++) {
            const pt = cellCenter(c, r);
            hero.afterimages.push({ x: pt.x, y: pt.y, facing: c === 2 ? -1 : 1, pose: 'kick', life: 0.95 });
          }
        }
      }

      state.bannerText = `💥 【${move.name}】`;
      state.bannerSub = move.desc;
      state.bannerKind = 'attack';
      state.bannerTimer = 1.65;

      // Determine which enemies are hit based on move.range ('col', 'row', 'cross', 'all_air', 'all')
      const g = getGridRect();
      let hitCount = 0;
      enemies.forEach(e => {
        if (!e.alive || e.kicked) return;
        let inRange = false;
        const distPx = Math.hypot(e.x - hero.px, e.y - hero.py);

        if (move.range === 'all') inRange = true;
        else if (move.range === 'all_air') inRange = e.isAir || distPx < g.cellW * 1.4;
        else if (move.range === 'col') inRange = (Math.abs(e.x - hero.px) < g.cellW * 0.95) || distPx < g.cellW * 1.1;
        else if (move.range === 'row') inRange = (Math.abs(e.y - hero.py) < g.cellH * 0.95) || distPx < g.cellW * 1.1;
        else inRange = distPx < g.cellW * 1.65; // 'cross'

        if (inRange) {
          hitCount++;
          const dmg = Math.round(move.dmg * (0.95 + Math.random() * 0.2));
          e.hp -= dmg;
          e.hitFlash = 0.16;
          shockwaves.push({ x: e.x, y: e.y, r: 16, maxR: 88, color: '#fef08a' });
          floatingTexts.push({
            x: e.x, y: e.y - 55,
            text: `💥 ${move.voice} -${dmg}`,
            color: '#fef08a', life: 0.95
          });

          if (e.hp <= 0) {
            // Kick the Dinosaur / Zombie / Mummy flying spinning out of the screen like a soccer ball!
            e.kicked = true;
            e.kickVx = (e.x >= hero.px ? 1 : -1) * (460 + Math.random() * 240);
            e.kickVy = -580 - Math.random() * 220;
            e.vRot = (Math.random() < 0.5 ? 1 : -1) * 14;
            state.kills++;
            state.score += e.isBoss ? 800 : 250;
            state.qi = Math.min(state.maxQi, state.qi + 12);
          }
        }
      });

      if (hitCount > 0) {
        state.hitstopRemaining = 48;
        state.shakeTimer = 0.22;
        state.shakeIntensity = move.range === 'all' ? 14 : 8;
      }
    }

    // =========================================================================
    // 8. DIRECT TILE CLICK/TAP, SWIPE & KEYBOARD CONTROLS
    // =========================================================================
    // Click/tap directly on any of the 9 Grid Cells to zip there!
    let swipeStartX = 0, swipeStartY = 0;
    canvas.addEventListener('pointerdown', e => {
      swipeStartX = e.clientX;
      swipeStartY = e.clientY;
      const g = getGridRect();
      if (e.clientX >= g.x && e.clientX <= g.x + g.w && e.clientY >= g.y && e.clientY <= g.y + g.h) {
        const c = Math.min(2, Math.max(0, Math.floor((e.clientX - g.x) / g.cellW)));
        const r = Math.min(2, Math.max(0, Math.floor((e.clientY - g.y) / g.cellH)));
        if (c !== hero.col) hero.facing = c > hero.col ? 1 : -1;
        hero.col = c;
        hero.row = r;
      }
    });
    canvas.addEventListener('pointerup', e => {
      const dx = e.clientX - swipeStartX;
      const dy = e.clientY - swipeStartY;
      if (Math.hypot(dx, dy) > 42) {
        if (Math.abs(dx) > Math.abs(dy)) moveHeroGrid(dx > 0 ? 1 : -1, 0);
        else moveHeroGrid(0, dy > 0 ? 1 : -1);
      }
    });

    document.getElementById('dp-up').addEventListener('pointerdown', e => { e.preventDefault(); moveHeroGrid(0, -1); });
    document.getElementById('dp-down').addEventListener('pointerdown', e => { e.preventDefault(); moveHeroGrid(0, 1); });
    document.getElementById('dp-left').addEventListener('pointerdown', e => { e.preventDefault(); moveHeroGrid(-1, 0); });
    document.getElementById('dp-right').addEventListener('pointerdown', e => { e.preventDefault(); moveHeroGrid(1, 0); });
    document.getElementById('dp-center').addEventListener('pointerdown', e => { e.preventDefault(); hero.col = 1; hero.row = 1; });

    // World, Faction, Music & Voice Selectors

    const KEY_TO_MOVE = {
      Space: 1, ShiftLeft: 1, ShiftRight: 1,
      KeyJ: 2, KeyK: 3, Digit1: 4, Digit2: 5, Digit3: 6, Digit4: 7, Digit5: 8,
      Digit6: 9, Digit7: 10, Digit8: 11, Digit9: 12, KeyL: 13, KeyU: 14, KeyI: 15,
      KeyO: 16, KeyP: 17, KeyF: 18, KeyG: 19, KeyR: 20, KeyZ: 21, KeyX: 22,
      KeyC: 23, KeyV: 24, KeyB: 25, KeyN: 26, KeyM: 27, KeyT: 28, KeyY: 29, KeyQ: 30, KeyE: 30
    };
    window.addEventListener('keydown', e => {
      if (e.code === 'KeyW' || e.code === 'ArrowUp') { e.preventDefault(); moveHeroGrid(0, -1); }
      else if (e.code === 'KeyS' || e.code === 'ArrowDown') { e.preventDefault(); moveHeroGrid(0, 1); }
      else if (e.code === 'KeyA' || e.code === 'ArrowLeft') { e.preventDefault(); moveHeroGrid(-1, 0); }
      else if (e.code === 'KeyD' || e.code === 'ArrowRight') { e.preventDefault(); moveHeroGrid(1, 0); }
      else if (KEY_TO_MOVE[e.code]) { e.preventDefault(); executeMove(KEY_TO_MOVE[e.code]); }
    });

    // =========================================================================
    // 9. SCROLLING WORLD BACKGROUNDS (JURASSIC / MODERN CITY / DESERT PYRAMID / STUDIO)
    // =========================================================================
    function drawScrollingWorld(ctx, w, h, scrollY) {
      if (state.world === 'city') {
        // Vibrant Illustrated 2D Scrolling Modern City Skyscraper Avenue!
        ctx.fillStyle = '#0f172a';
        ctx.fillRect(0, 0, w, h);

        const roadW = Math.min(680, w * 0.68);
        const roadX = (w - roadW) * 0.5;

        // Sidewalks & Modern Skyscraper Rooftops on Left & Right
        ctx.fillStyle = '#334155';
        ctx.fillRect(0, 0, roadX, h);
        ctx.fillRect(roadX + roadW, 0, w - roadX - roadW, h);

        const blockH = 170;
        const offset = scrollY % blockH;
        const neonColors = ['#ec4899', '#38bdf8', '#facc15', '#22c55e'];
        const signs = ['功夫武馆', '24H 便利店', '花鼓茶楼', '健身中心'];
        for (let y = -blockH + offset; y < h + blockH; y += blockH) {
          const idx = Math.abs(Math.floor((y - offset) / blockH)) % 4;
          // Left Building Roof
          ctx.fillStyle = idx % 2 === 0 ? '#1e293b' : '#1e1b4b';
          ctx.strokeStyle = '#475569';
          ctx.lineWidth = 3;
          ctx.fillRect(14, y + 10, Math.max(40, roadX - 36), blockH - 22);
          ctx.strokeRect(14, y + 10, Math.max(40, roadX - 36), blockH - 22);
          // Glowing Neon Sign overhanging sidewalk
          ctx.fillStyle = neonColors[idx];
          ctx.fillRect(roadX - 24, y + 48, 22, 54);

          // Right Building Roof
          ctx.fillStyle = idx % 2 === 0 ? '#1e1b4b' : '#1e293b';
          ctx.fillRect(roadX + roadW + 22, y + 10, Math.max(40, w - roadX - roadW - 36), blockH - 22);
          ctx.strokeRect(roadX + roadW + 22, y + 10, Math.max(40, w - roadX - roadW - 36), blockH - 22);
          ctx.fillStyle = neonColors[(idx + 2) % 4];
          ctx.fillRect(roadX + roadW + 2, y + 48, 22, 54);
        }

        // Asphalt Road Surface
        ctx.fillStyle = '#18181b';
        ctx.fillRect(roadX, 0, roadW, h);

        // Scrolling Yellow Dashed Road Lanes & White Crosswalks
        ctx.strokeStyle = '#facc15';
        ctx.lineWidth = 5;
        ctx.setLineDash([36, 36]);
        ctx.lineDashOffset = -scrollY;
        ctx.beginPath();
        ctx.moveTo(roadX + roadW * 0.33, 0); ctx.lineTo(roadX + roadW * 0.33, h);
        ctx.moveTo(roadX + roadW * 0.67, 0); ctx.lineTo(roadX + roadW * 0.67, h);
        ctx.stroke();
        ctx.setLineDash([]);
      } else {
        // Seamless perspective stage background + dynamic downward scrolling speed-streaks (Zero horizontal seam!)
        const bgKey = state.world === 'desert' ? 'bg_desert' : (state.world === 'studio' ? 'bg_studio' : 'bg_jurassic');
        const img = ASSETS[bgKey];
        if (img && img.complete && img.naturalWidth > 0) {
          const pulse = 1.02 + Math.sin(scrollY * 0.008) * 0.015;
          const scale = Math.max(w / img.naturalWidth, h / img.naturalHeight) * pulse;
          const dw = img.naturalWidth * scale;
          const dh = img.naturalHeight * scale;
          ctx.drawImage(img, (w - dw) * 0.5, (h - dh) * 0.5, dw, dh);
        } else {
          ctx.fillStyle = '#1c1917';
          ctx.fillRect(0, 0, w, h);
        }

        // Animated downward running speed lines along the vertical track to convey continuous sprinting!
        ctx.save();
        ctx.strokeStyle = state.world === 'desert' ? 'rgba(254, 240, 138, 0.25)' : 'rgba(255, 255, 255, 0.20)';
        ctx.lineWidth = 3;
        const laneW = Math.min(580, w * 0.65);
        const laneX = (w - laneW) * 0.5;
        for (let i = 0; i < 6; i++) {
          const lx = laneX + ((i + 0.5) / 6) * laneW;
          const ly = ((scrollY * 1.45 + i * 170) % (h + 120)) - 60;
          ctx.beginPath();
          ctx.moveTo(lx, ly);
          ctx.lineTo(lx, ly + 46);
          ctx.stroke();
        }
        ctx.restore();

        // Subtle vignette so the 3x3 grid and characters pop with ultra clarity
        ctx.fillStyle = 'rgba(0, 0, 0, 0.22)';
        ctx.fillRect(0, 0, w, h);
      }
    }

    // =========================================================================
    // 10. DRAW THE 3x3 OBLIQUE GRID WITH RED DANGER TELEGRAPH & ARROWS
    // =========================================================================
    function draw3x3Grid(ctx, t) {
      const g = getGridRect();

      // Outer 3x3 Arena Glow Border
      ctx.save();
      ctx.fillStyle = 'rgba(9, 13, 24, 0.42)';
      ctx.strokeStyle = 'rgba(245, 158, 11, 0.68)';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.roundRect(g.x - 8, g.y - 8, g.w + 16, g.h + 16, 16);
      ctx.fill();
      ctx.stroke();

      const rowLabels = ['上排', '中排', '下排'];
      const colLabels = ['左', '中', '右'];

      for (let r = 0; r < 3; r++) {
        for (let c = 0; c < 3; c++) {
          const cx = g.x + c * g.cellW;
          const cy = g.y + r * g.cellH;
          const isHeroCell = (hero.col === c && hero.row === r);

          // Check incoming enemies targeting this cell
          const threats = enemies.filter(e => e.alive && !e.kicked && e.targetCells.some(tc => tc.c === c && tc.r === r));
          const isDanger = threats.length > 0;

          if (isDanger) {
            const pulse = 0.28 + Math.abs(Math.sin(t * 14)) * 0.34;
            ctx.fillStyle = `rgba(239, 68, 68, ${pulse})`;
            ctx.strokeStyle = '#ef4444';
            ctx.lineWidth = 3;
          } else if (isHeroCell) {
            ctx.fillStyle = hero.iframeTimer > 0 ? 'rgba(56, 189, 248, 0.32)' : 'rgba(245, 158, 11, 0.22)';
            ctx.strokeStyle = hero.iframeTimer > 0 ? '#38bdf8' : '#f59e0b';
            ctx.lineWidth = 3;
          } else {
            ctx.fillStyle = 'rgba(255, 255, 255, 0.06)';
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.24)';
            ctx.lineWidth = 1.5;
          }

          ctx.beginPath();
          ctx.roundRect(cx + 4, cy + 4, g.cellW - 8, g.cellH - 8, 10);
          ctx.fill();
          ctx.stroke();

          // Coordinate tag
          ctx.font = 'bold 10px "Microsoft YaHei"';
          ctx.fillStyle = 'rgba(255,255,255,0.45)';
          ctx.textAlign = 'left';
          ctx.fillText(`${rowLabels[r]}·${colLabels[c]}`, cx + 10, cy + 18);

          // Directional Warning Icon on Dangerous Tiles!
          if (isDanger) {
            const dirIcon = threats[0].dir === 'top_down' ? '⬇' : (threats[0].dir === 'left_right' ? '➡' : (threats[0].dir === 'right_left' ? '⬅' : '🎯'));
            ctx.font = '900 24px "Segoe UI Emoji", sans-serif';
            ctx.fillStyle = '#fef08a';
            ctx.textAlign = 'center';
            ctx.fillText(dirIcon, cx + g.cellW * 0.5, cy + g.cellH * 0.56);
          }
        }
      }
      ctx.restore();
    }

    // =========================================================================
    // 11. DRAW HERO (RUNNING IN PLACE ON GRID TILE) & ENEMIES
    // =========================================================================
    function drawHero(ctx, x, y, facing, pose, alpha = 1.0, isGhost = false, t = 0) {
      const img = pose === 'kick' ? ASSETS.hero_kick : (pose === 'dodge' ? ASSETS.hero_dodge : ASSETS.hero_ready);
      if (!img || !img.complete || img.naturalWidth === 0) return;

      const g = getGridRect();
      const drawH = Math.min(148, g.cellH * 1.28);
      const drawW = (img.naturalWidth / img.naturalHeight) * drawH;

      // Continuous lively "running in place" bobbing & tilt when in ready stance!
      const runBob = pose === 'ready' ? Math.abs(Math.sin(t * 14)) * 10 : 0;
      const runTilt = pose === 'ready' ? Math.sin(t * 14) * 0.06 : 0;

      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.translate(x, y + g.cellH * 0.36);

      // Running Dust Puffs beneath shoes!
      if (!isGhost) {
        ctx.fillStyle = 'rgba(0,0,0,0.48)';
        ctx.beginPath();
        ctx.ellipse(0, 0, drawW * 0.36, 10, 0, 0, Math.PI * 2);
        ctx.fill();

        if (pose === 'ready') {
          ctx.fillStyle = 'rgba(254, 243, 199, 0.35)';
          const dOff = (t * 80) % 24;
          ctx.beginPath(); ctx.arc(-14, 4 + dOff * 0.5, 5, 0, Math.PI * 2); ctx.fill();
          ctx.beginPath(); ctx.arc(14, 12 - dOff * 0.4, 4, 0, Math.PI * 2); ctx.fill();
        }
      }

      ctx.translate(0, -runBob);
      ctx.rotate(runTilt);
      ctx.scale(facing, 1);

      if (isGhost) ctx.filter = 'hue-rotate(175deg) brightness(1.45) saturate(2.5)';
      ctx.drawImage(img, -drawW * 0.5, -drawH + 6, drawW, drawH);
      ctx.filter = 'none';

      // Custom Uploaded Head Photo
      if (state.customHeadImg && !isGhost) {
        const headY = pose === 'kick' ? -drawH * 0.74 : -drawH * 0.78;
        const headR = drawH * 0.14;
        ctx.save();
        ctx.beginPath(); ctx.arc(0, headY, headR, 0, Math.PI * 2); ctx.clip();
        ctx.drawImage(state.customHeadImg, -headR, headY - headR, headR * 2, headR * 2);
        ctx.restore();
      }

      // Golden Crescent Arc on Attack Moves
      if (!isGhost && pose === 'kick') {
        ctx.strokeStyle = '#fef08a';
        ctx.lineWidth = 6;
        ctx.shadowColor = '#f59e0b';
        ctx.shadowBlur = 16;
        ctx.beginPath();
        ctx.arc(drawW * 0.15, -drawH * 0.55, drawH * 0.5, -1.2, 0.6);
        ctx.stroke();
        ctx.shadowBlur = 0;
      }

      ctx.restore();
    }

    function drawEnemy(ctx, e, t) {
      const img = ASSETS[e.sprite];
      if (!img || !img.complete || img.naturalWidth === 0) return;

      const g = getGridRect();
      const baseH = Math.min(138, g.cellH * 1.15) * e.scale;
      const drawW = (img.naturalWidth / img.naturalHeight) * baseH;
      const drawH = baseH;

      ctx.save();
      ctx.translate(e.x, e.y);

      if (e.rot !== 0) ctx.rotate(e.rot);
      const bob = Math.abs(Math.sin(t * 11)) * 7;
      ctx.translate(0, -bob);
      ctx.scale(e.facing, 1);

      if (e.hitFlash > 0) ctx.filter = 'brightness(2.5) contrast(1.4)';
      ctx.drawImage(img, -drawW * 0.5, -drawH * 0.65, drawW, drawH);
      ctx.filter = 'none';
      ctx.restore();

      // Enemy Name & HP Bar
      if (!e.kicked) {
        const bw = e.isBoss ? 92 : 58;
        const by = e.y - drawH * 0.68 - 10;
        ctx.fillStyle = 'rgba(0,0,0,0.75)';
        ctx.fillRect(e.x - bw * 0.5, by, bw, 6);
        ctx.fillStyle = e.isBoss ? '#ef4444' : '#22c55e';
        ctx.fillRect(e.x - bw * 0.5, by, bw * Math.max(0, e.hp / e.maxHp), 6);
        ctx.font = 'bold 10.5px "Microsoft YaHei"';
        ctx.textAlign = 'center';
        ctx.strokeStyle = '#000'; ctx.lineWidth = 3;
        ctx.strokeText(e.label, e.x, by - 4);
        ctx.fillStyle = e.isBoss ? '#fca5a5' : '#fef08a';
        ctx.fillText(e.label, e.x, by - 4);
      }
    }

    // =========================================================================
    // 12. MAIN 60FPS GAME LOOP
    // =========================================================================
    spawnEnemyWave();
    let lastTime = performance.now();
    let fpsFrames = 0, fpsTimer = 0;
    let spawnTimer = 1.4;
    let aiCooldown = 0;

    function loop(now) {
      requestAnimationFrame(loop);
      const rawDt = Math.min((now - lastTime) / 1000, 0.1);
      lastTime = now;
      const t = now * 0.001;

      fpsFrames++;
      fpsTimer += rawDt;
      if (fpsTimer >= 0.5) {
        state.fps = Math.min(60, Math.round(fpsFrames / fpsTimer));
        document.getElementById('fps-val').textContent = state.fps + ' OK';
        fpsFrames = 0; fpsTimer = 0;
      }

      if (state.hitstopRemaining > 0) {
        state.hitstopRemaining -= rawDt * 1000;
        return;
      }

      if (state.witchTimeTimer > 0) state.witchTimeTimer = Math.max(0, state.witchTimeTimer - rawDt);
      const dt = rawDt;
      const enemyDt = state.witchTimeTimer > 0 ? rawDt * 0.3 : rawDt;

      // Scroll background continuously downward to create "Running In Place" sensation!
      state.scrollY += 220 * dt;

      // Smooth Hero interpolation to current 3x3 grid tile
      const targetPt = cellCenter(hero.col, hero.row);
      hero.px += (targetPt.x - hero.px) * Math.min(1, dt * 18);
      hero.py += (targetPt.y - hero.py) * Math.min(1, dt * 18);

      if (hero.poseTimer > 0) {
        hero.poseTimer -= dt;
        if (hero.poseTimer <= 0) hero.pose = 'ready';
      }
      if (hero.iframeTimer > 0) hero.iframeTimer -= dt;

      // Optional AI Demo Mode
      if (state.autoBot) {
        aiCooldown -= dt;
        if (aiCooldown <= 0) {
          if (isCellDangerous(hero.col, hero.row)) {
            executeMove(1); // Pure Shanshenbu Dodge!
            aiCooldown = 0.65;
          } else if (enemies.some(e => e.alive && !e.kicked && e.telegraphTimer <= 0)) {
            executeMove(Math.random() < 0.65 ? 2 : 3); // Counter-attack Langzi Tiqiu!
            aiCooldown = 0.95;
          }
        }
      }

      // Spawn Waves
      spawnTimer -= enemyDt;
      if (spawnTimer <= 0) {
        spawnEnemyWave();
        if (Math.random() < 0.35) spawnEnemyWave();
        spawnTimer = Math.max(0.85, 1.85 - state.wave * 0.06);
      }

      // Update Enemies
      const g = getGridRect();
      for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i];
        if (e.hitFlash > 0) e.hitFlash -= dt;

        if (e.kicked) {
          e.x += e.kickVx * dt;
          e.y += e.kickVy * dt;
          e.kickVy += 920 * dt;
          e.rot += e.vRot * dt;
          if (e.x < -250 || e.x > canvas.width + 250 || e.y > canvas.height + 250 || e.y < -350) {
            enemies.splice(i, 1);
          }
          continue;
        }

        if (e.telegraphTimer > 0) {
          e.telegraphTimer -= enemyDt;
          continue;
        }

        e.progress += e.speed * enemyDt;
        e.x = e.startX + (e.endX - e.startX) * e.progress;
        e.y = e.startY + (e.endY - e.startY) * e.progress;

        // Check Collision with Hero on 3x3 Grid
        if (!e.hitPlayer && Math.hypot(e.x - hero.px, e.y - hero.py) < Math.min(g.cellW, g.cellH) * 0.56) {
          if (hero.iframeTimer > 0) {
            // Successfully dodged right through attack with Shanshenbu I-frames!
            e.hitPlayer = true;
          } else {
            e.hitPlayer = true;
            state.hp = Math.max(15, state.hp - (e.isBoss ? 20 : 12));
            state.shakeTimer = 0.22;
            state.shakeIntensity = 11;
            music.playSFX('hurt');
            floatingTexts.push({ x: hero.px, y: hero.py - 80, text: '💢 被撞到！快按【闪身步】躲避！', color: '#ef4444', life: 0.95 });
          }
        }

        if (e.progress >= 1.05) {
          enemies.splice(i, 1);
          state.score += 30;
        }
      }

      // =======================================================================
      // RENDER FRAME
      // =======================================================================
      ctx.save();
      if (state.shakeTimer > 0) {
        state.shakeTimer -= dt;
        ctx.translate((Math.random() - 0.5) * state.shakeIntensity, (Math.random() - 0.5) * state.shakeIntensity);
      }

      drawScrollingWorld(ctx, canvas.width, canvas.height, state.scrollY);
      draw3x3Grid(ctx, t);

      if (state.witchTimeTimer > 0) {
        ctx.fillStyle = 'rgba(30, 27, 75, 0.26)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }

      // Afterimages
      for (let i = hero.afterimages.length - 1; i >= 0; i--) {
        const a = hero.afterimages[i];
        a.life -= dt;
        if (a.life <= 0) { hero.afterimages.splice(i, 1); continue; }
        drawHero(ctx, a.x, a.y, a.facing, a.pose, a.life * 0.72, true, t);
      }

      // Depth-sorted Hero + Enemies by Y
      const drawables = [
        { y: hero.py, fn: () => drawHero(ctx, hero.px, hero.py, hero.facing, hero.pose, 1.0, false, t) },
        ...enemies.filter(e => e.telegraphTimer <= 0 || e.kicked).map(e => ({ y: e.y, fn: () => drawEnemy(ctx, e, t) }))
      ].sort((a, b) => a.y - b.y);
      drawables.forEach(d => d.fn());

      // Shockwaves
      for (let i = shockwaves.length - 1; i >= 0; i--) {
        const s = shockwaves[i];
        s.r += dt * 360;
        if (s.r >= s.maxR) { shockwaves.splice(i, 1); continue; }
        ctx.strokeStyle = s.color;
        ctx.lineWidth = 4.5;
        ctx.globalAlpha = 1 - s.r / s.maxR;
        ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.stroke();
        ctx.globalAlpha = 1;
      }

      // Floating Texts
      for (let i = floatingTexts.length - 1; i >= 0; i--) {
        const ft = floatingTexts[i];
        ft.life -= dt;
        ft.y -= 44 * dt;
        if (ft.life <= 0) { floatingTexts.splice(i, 1); continue; }
        ctx.save();
        ctx.globalAlpha = Math.min(1, ft.life * 1.5);
        ctx.font = '900 15px "Microsoft YaHei"';
        ctx.textAlign = 'center';
        ctx.strokeStyle = '#000'; ctx.lineWidth = 4;
        ctx.strokeText(ft.text, ft.x, ft.y);
        ctx.fillStyle = ft.color;
        ctx.fillText(ft.text, ft.x, ft.y);
        ctx.restore();
      }

      // Giant Chinese Move Banner positioned cleanly at top center between the two HUD cards (never covers hero!)
      if (state.bannerTimer > 0) {
        state.bannerTimer -= dt;
        const by = 46;
        ctx.save();
        ctx.globalAlpha = Math.min(1, state.bannerTimer * 2.2);
        ctx.font = 'bold 11px "Microsoft YaHei"';
        const sw = ctx.measureText(state.bannerSub).width;
        const bw = Math.min(canvas.width - 610, Math.max(320, sw + 34));
        const safeBw = Math.max(300, bw);
        ctx.fillStyle = state.bannerKind === 'dodge' ? 'rgba(3, 105, 161, 0.90)' : 'rgba(154, 52, 18, 0.90)';
        ctx.strokeStyle = state.bannerKind === 'dodge' ? '#38bdf8' : '#f59e0b';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.roundRect(canvas.width * 0.5 - safeBw * 0.5, by - 24, safeBw, 48, 10);
        ctx.fill(); ctx.stroke();

        ctx.font = '900 16.5px "Microsoft YaHei"';
        ctx.fillStyle = '#fef08a';
        ctx.textAlign = 'center';
        ctx.fillText(state.bannerText, canvas.width * 0.5, by - 3);

        ctx.font = 'bold 10.5px "Microsoft YaHei"';
        ctx.fillStyle = '#f0f9ff';
        ctx.fillText(state.bannerSub.slice(0, 44), canvas.width * 0.5, by + 15);
        ctx.restore();
      }

      ctx.restore();

      // Update DOM HUD
      document.getElementById('hp-bar').style.width = ((state.hp / state.maxHp) * 100) + '%';
      document.getElementById('hp-text').textContent = Math.round(state.hp) + '/' + state.maxHp;
      document.getElementById('qi-bar').style.width = ((state.qi / state.maxQi) * 100) + '%';
      document.getElementById('qi-text').textContent = Math.round(state.qi) + '/' + state.maxQi;
      document.getElementById('dodge-val').textContent = state.perfectDodges + ' 次';
      document.getElementById('kills-val').textContent = state.kills;
      document.getElementById('score-val').textContent = state.score;

      state.framesRendered++;
    }

    requestAnimationFrame(loop);
  </script>
</body>
</html>
