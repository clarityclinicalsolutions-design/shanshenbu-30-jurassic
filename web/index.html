<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>《闪身步30招：全屏九宫格大乱斗》 — 恐龙 / 拟真丧尸 / 拟真木乃伊 + 搞笑撞屏结局</title>
  <style>
    :root {
      --gold: #f59e0b;
      --cyan: #38bdf8;
      --crimson: #ef4444;
      --emerald: #10b981;
      --bg-card: rgba(10, 10, 14, 0.86);
      --border-gold: rgba(245, 158, 11, 0.52);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
    body, html {
      width: 100%; height: 100%; overflow: hidden;
      background: #09090b; color: #fafaf9;
      font-family: 'Microsoft YaHei', 'Segoe UI', system-ui, sans-serif;
    }
    #game-canvas {
      position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none;
    }

    /* Top HUD Bar */
    .hud-top {
      position: absolute; top: 6px; left: 8px; right: 8px;
      display: flex; justify-content: space-between; align-items: flex-start;
      pointer-events: none; z-index: 15; gap: 8px;
    }
    .hud-card {
      background: var(--bg-card); backdrop-filter: blur(10px);
      border: 1px solid var(--border-gold); border-radius: 11px;
      padding: 7px 10px; pointer-events: auto;
      box-shadow: 0 8px 26px rgba(0, 0, 0, 0.7);
    }
    .title-line {
      display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 900; color: var(--gold);
    }
    .badge-v2 {
      font-size: 9.5px; padding: 1px 7px; border-radius: 99px;
      background: rgba(56, 189, 248, 0.22); color: #7dd3fc; border: 1px solid rgba(56,189,248,0.45);
    }
    .bars-box { margin-top: 4px; display: flex; flex-direction: column; gap: 3px; min-width: 215px; }
    .bar-row { display: flex; align-items: center; gap: 6px; font-size: 10px; font-weight: 700; }
    .bar-bg { flex: 1; height: 8px; background: rgba(255,255,255,0.14); border-radius: 99px; overflow: hidden; }
    .bar-fg { height: 100%; transition: width 0.12s; border-radius: 99px; }
    .hp-fg { background: linear-gradient(90deg, #dc2626, #f59e0b); width: 100%; }
    .qi-fg { background: linear-gradient(90deg, #0ea5e9, #c084fc); width: 50%; }
    .stats-row {
      display: grid; grid-template-columns: repeat(4, auto); gap: 9px;
      margin-top: 4px; font-size: 10px;
    }
    .st-cell span { font-size: 8.5px; color: #a8a29e; display: block; }
    .st-cell strong { font-size: 12px; color: #fff; }

    /* Right Control Workshop */
    .hud-right {
      width: 288px; display: flex; flex-direction: column; gap: 4px;
    }
    .panel-head {
      display: flex; justify-content: space-between; align-items: center;
      font-size: 10.5px; font-weight: 800; color: var(--gold);
    }
    .ctrl-row {
      display: flex; align-items: center; gap: 5px; font-size: 10px;
    }
    .ctrl-row label { width: 50px; color: #d6d3d1; font-weight: 700; flex-shrink: 0; }
    .ctrl-select {
      flex: 1; background: rgba(28, 25, 23, 0.96); color: #fef3c7;
      border: 1px solid rgba(245, 158, 11, 0.4); border-radius: 6px;
      padding: 2.5px 6px; font-size: 10px; font-weight: 700; outline: none; cursor: pointer;
    }
    .btn-grid-2 {
      display: grid; grid-template-columns: 1fr 1fr; gap: 4px; margin-top: 1px;
    }
    .c-btn {
      padding: 3.5px 6px; font-size: 10px; font-weight: 700;
      border-radius: 6px; border: 1px solid rgba(245, 158, 11, 0.38);
      background: rgba(255, 255, 255, 0.08); color: #fef3c7; cursor: pointer;
      transition: all 0.14s; text-align: center; white-space: nowrap; text-decoration: none;
      display: inline-flex; align-items: center; justify-content: center;
    }
    .c-btn:hover, .c-btn.active {
      background: var(--gold); color: #0c0a09; border-color: #fff;
    }

    /* Bottom Dock */
    .moves-dock {
      position: absolute; bottom: 5px; left: 8px; right: 8px; z-index: 15;
      background: var(--bg-card); backdrop-filter: blur(12px);
      border: 1px solid var(--border-gold); border-radius: 10px;
      padding: 5px 8px; pointer-events: auto;
    }
    .dock-header {
      display: flex; justify-content: space-between; align-items: center;
      flex-wrap: wrap; gap: 4px; margin-bottom: 4px;
    }
    .stance-tabs { display: flex; gap: 4px; flex-wrap: wrap; }
    .stance-tab {
      padding: 2px 8px; border-radius: 99px; font-size: 10px; font-weight: 700;
      background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.16);
      color: #e7e5e4; cursor: pointer;
    }
    .stance-tab.active { background: var(--gold); color: #0c0a09; border-color: #fff; }
    .moves-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(132px, 1fr));
      gap: 4px; max-height: 60px; overflow-y: auto; padding-right: 4px;
    }
    .move-card {
      background: rgba(24, 24, 27, 0.94);
      border: 1px solid rgba(245, 158, 11, 0.3);
      border-radius: 6px; padding: 3px 6px; cursor: pointer; transition: all 0.12s;
    }
    .move-card.is-dodge { border-color: rgba(56, 189, 248, 0.45); }
    .move-card.is-dodge .m-name { color: #7dd3fc; }
    .move-card:hover { transform: translateY(-1px); background: rgba(245, 158, 11, 0.22); }
    .move-card.active-move {
      border-color: #fff; box-shadow: 0 0 12px rgba(245, 158, 11, 0.65);
      background: rgba(245, 158, 11, 0.3);
    }
    .move-card .m-name { font-size: 10px; font-weight: 800; color: #fef08a; }
    .move-card .m-meta {
      font-size: 8.5px; color: #a8a29e; display: flex; justify-content: space-between; margin-top: 1px;
    }

    /* Floating Touch D-Pad & Action Buttons */
    .touch-overlay {
      position: absolute; bottom: 102px; left: 12px; right: 12px;
      display: flex; justify-content: space-between; align-items: flex-end;
      pointer-events: none; z-index: 16;
    }
    .dpad-grid {
      display: grid; grid-template-columns: repeat(3, 40px); grid-template-rows: repeat(3, 40px);
      gap: 3px; pointer-events: auto;
    }
    .dpad-btn {
      border-radius: 8px; border: 1px solid rgba(245, 158, 11, 0.55);
      background: rgba(15, 23, 42, 0.68); color: #fef08a; font-size: 15px; font-weight: 900;
      cursor: pointer; touch-action: manipulation;
    }
    .dpad-btn:active { background: var(--gold); color: #000; }
    .action-circles {
      display: flex; gap: 7px; align-items: flex-end; pointer-events: auto;
    }
    .act-btn {
      width: 64px; height: 64px; border-radius: 50%; border: 2.5px solid #fff;
      font-weight: 900; font-size: 11.5px; cursor: pointer;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.7); touch-action: manipulation;
    }
    .act-btn small { font-size: 8px; font-weight: 700; opacity: 0.92; }
    .act-dodge { background: linear-gradient(135deg, #38bdf8, #0284c7); color: #fff; width: 70px; height: 70px; }
    .act-kick { background: linear-gradient(135deg, #fef08a, #f59e0b); color: #0c0a09; }
    .act-ult { background: linear-gradient(135deg, #fca5a5, #dc2626); color: #fff; width: 56px; height: 56px; }

    /* Hilarious Game-Over Glass-Splat Overlay Card (Appears after hero splats & starts sliding!) */
    #gameover-overlay {
      position: absolute; bottom: 26px; left: 50%; transform: translateX(-50%);
      z-index: 40; display: none; flex-direction: column; align-items: center;
      background: rgba(15, 10, 12, 0.92); backdrop-filter: blur(12px);
      border: 2.5px solid #ef4444; border-radius: 16px;
      padding: 16px 26px; text-align: center; min-width: 340px; max-width: 92vw;
      box-shadow: 0 16px 50px rgba(0, 0, 0, 0.85), 0 0 30px rgba(239, 68, 68, 0.45);
      animation: popInCard 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    #gameover-overlay.show { display: flex; }
    @keyframes popInCard {
      from { opacity: 0; transform: translate(-50%, 30px) scale(0.85); }
      to { opacity: 1; transform: translate(-50%, 0) scale(1); }
    }
    .go-stamp {
      font-size: 26px; font-weight: 900; color: #fef08a;
      text-shadow: 0 3px 10px #dc2626; letter-spacing: 0.06em;
    }
    .go-epitaph {
      font-size: 13px; color: #fca5a5; font-weight: 700; margin: 6px 0 10px;
    }
    .go-stats {
      display: flex; gap: 16px; justify-content: center; flex-wrap: wrap;
      font-size: 12px; color: #e7e5e4; margin-bottom: 12px;
      background: rgba(255,255,255,0.06); padding: 8px 14px; border-radius: 10px;
    }
    .go-stats strong { color: #38bdf8; font-size: 15px; display: block; }
    .btn-restart {
      background: linear-gradient(135deg, #f59e0b, #ef4444);
      color: #fff; border: 2px solid #fef08a; border-radius: 99px;
      padding: 9px 26px; font-size: 15px; font-weight: 900; cursor: pointer;
      box-shadow: 0 6px 20px rgba(239, 68, 68, 0.5); transition: transform 0.15s;
    }
    .btn-restart:hover { transform: scale(1.06); }

    body.hud-collapsed .hud-right .ctrl-row,
    body.hud-collapsed .hud-right .btn-grid-2,
    body.hud-collapsed .moves-dock .moves-grid { display: none !important; }

    @media (max-width: 960px), (max-height: 600px) {
      .hud-top > .hud-card:first-child { transform: scale(0.76); transform-origin: top left; }
      .hud-right { transform: scale(0.74); transform-origin: top right; }
      .moves-grid { max-height: 44px; }
      .dpad-grid { transform: scale(0.84); transform-origin: bottom left; }
      .action-circles { transform: scale(0.84); transform-origin: bottom right; }
    }
  </style>
</head>
<body>
  <canvas id="game-canvas"></canvas>

  <!-- Top HUD -->
  <div class="hud-top">
    <div class="hud-card">
      <div class="title-line">
        <span>🕺 《闪身步30招：全屏九宫格》</span>
        <span class="badge-v2" id="diff-badge">🟡 中等难度</span>
      </div>
      <div style="font-size:9.5px;color:#d6d3d1;margin-top:2px;">
        WASD/点全屏九宫格移动 | <strong style="color:#38bdf8;">Space: 01.闪身步(纯躲避)</strong> | <strong style="color:#f59e0b;">J: 02.浪子踢球(攻击)</strong>
      </div>
      <div class="bars-box">
        <div class="bar-row">
          <span style="width:40px;color:#f87171;">气血HP</span>
          <div class="bar-bg"><div id="hp-bar" class="bar-fg hp-fg"></div></div>
          <span id="hp-text" style="width:52px;text-align:right;">150/150</span>
        </div>
        <div class="bar-row">
          <span style="width:40px;color:#38bdf8;">气力QI</span>
          <div class="bar-bg"><div id="qi-bar" class="bar-fg qi-fg"></div></div>
          <span id="qi-text" style="width:52px;text-align:right;">60/100</span>
        </div>
      </div>
      <div class="stats-row">
        <div class="st-cell"><span>完美闪身</span><strong id="dodge-val" style="color:#38bdf8;">0 次</strong></div>
        <div class="st-cell"><span>踢飞击败</span><strong id="kills-val" style="color:#f59e0b;">0</strong></div>
        <div class="st-cell"><span>连击得分</span><strong id="score-val">0</strong></div>
        <div class="st-cell"><span>FPS / QA</span><strong id="fps-val" style="color:#4ade80;">60 OK</strong></div>
      </div>
    </div>

    <!-- Right Panel: Difficulty / World / Enemy / Voice / Comedy BGM -->
    <div class="hud-card hud-right">
      <div class="panel-head">
        <span>⚙️ 难度 / 多世界 / 语音 / 配乐</span>
        <button class="c-btn" style="padding:1px 6px;" onclick="document.body.classList.toggle('hud-collapsed')">折叠/展开</button>
      </div>

      <div class="ctrl-row">
        <label>🔥 难度:</label>
        <select id="sel-difficulty" class="ctrl-select" style="border-color:#ef4444;color:#fef08a;">
          <option value="easy">🟢 简单 Easy (新手热身·预警长)</option>
          <option value="medium" selected>🟡 中等 Medium (标准街机节奏)</option>
          <option value="hard">🔴 困难 Hard (高速夹击·高伤害)</option>
          <option value="nightmare">💀 地狱宗师 Nightmare (极限闪身)</option>
        </select>
      </div>

      <div class="ctrl-row">
        <label>🗺️ 场景:</label>
        <select id="sel-world" class="ctrl-select">
          <option value="jurassic">🌋 侏罗纪恐龙世界 (配恐龙)</option>
          <option value="city">🏙️ 现代都市摩天楼 (配拟真丧尸)</option>
          <option value="desert">🏜️ 古埃及沙漠金字塔 (配拟真木乃伊)</option>
          <option value="studio">🪞 北舞练功房时空裂缝 (全明星)</option>
        </select>
      </div>

      <div class="ctrl-row">
        <label>👾 敌人:</label>
        <select id="sel-faction" class="ctrl-select">
          <option value="dinos">🦖 侏罗纪恐龙大军 (手绘精版)</option>
          <option value="zombies">🧟 现代写实丧尸大军 (拟真硬核)</option>
          <option value="mummies">🏺 古埃及写实木乃伊 (拟真法老)</option>
          <option value="mixed">🌀 全明星时空大乱斗</option>
        </select>
      </div>

      <div class="ctrl-row">
        <label>🎵 音乐:</label>
        <select id="sel-bgm" class="ctrl-select">
          <option value="huagudeng">🥁 魔性花鼓灯锣鼓 (原味鬼畜)</option>
          <option value="comedy">🤡 功夫喜剧搞笑唢呐快板</option>
          <option value="desert_snake">🏺 沙漠神秘搞笑蛇笛舞曲</option>
          <option value="retro_8bit">👾 8-Bit 复古搞笑像素电音</option>
        </select>
      </div>

      <div class="btn-grid-2">
        <button class="c-btn active" id="btn-voice">🔊 喊招语音: ON</button>
        <button class="c-btn" id="btn-bgm-toggle">🎵 搞笑配乐: OFF</button>
        <button class="c-btn" id="btn-autobot">🤖 AI演示: OFF</button>
        <label class="c-btn" style="cursor:pointer;">
          📷 上传真人头像
          <input type="file" id="avatar-upload" accept="image/*" style="display:none;" />
        </label>
      </div>
      <div style="margin-top:2px;">
        <a href="brawler_v1.html" class="c-btn" style="width:100%;background:rgba(168,85,247,0.22);border-color:#c084fc;color:#e9d5ff;">
          🥊 切换回 v1.0 横版《恐龙快打》街机模式
        </a>
      </div>
    </div>
  </div>

  <!-- On-Screen Touch D-Pad & Action Buttons -->
  <div class="touch-overlay" id="touch-overlay">
    <div class="dpad-grid" title="九宫格方向移动 (也可直接点全屏任意格子！)">
      <div></div>
      <button type="button" class="dpad-btn" id="dp-up">⬆</button>
      <div></div>
      <button type="button" class="dpad-btn" id="dp-left">⬅</button>
      <button type="button" class="dpad-btn" id="dp-center" style="font-size:11px;">中</button>
      <button type="button" class="dpad-btn" id="dp-right">➡</button>
      <div></div>
      <button type="button" class="dpad-btn" id="dp-down">⬇</button>
      <div></div>
    </div>

    <div class="action-circles">
      <button type="button" class="act-btn act-dodge" id="act-dodge">闪身步<small>纯躲避·回气</small></button>
      <button type="button" class="act-btn act-kick" id="act-kick">浪子踢球<small>攻击击飞</small></button>
      <button type="button" class="act-btn act-ult" id="act-ult">30路<small>全屏奥义</small></button>
    </div>
  </div>

  <!-- Bottom 30 Moves Dock -->
  <div class="moves-dock" id="moves-dock">
    <div class="dock-header">
      <div class="stance-tabs" id="stance-tabs">
        <button class="stance-tab active" data-cat="all">📜 全部 30 招</button>
        <button class="stance-tab" data-cat="dodge">💨 纯闪避步法 (10招)</button>
        <button class="stance-tab" data-cat="attack">🦵 反击绝招 (20招)</button>
      </div>
      <div style="display:flex;gap:5px;flex-wrap:wrap;">
        <button class="c-btn" style="background:#0284c7;color:#fff;border-color:#7dd3fc;" onclick="executeMove(1)">💨 01.闪身步(纯躲)</button>
        <button class="c-btn" style="background:#f59e0b;color:#000;" onclick="executeMove(2)">⚽ 02.浪子踢球(攻)</button>
        <button class="c-btn" style="background:#9333ea;color:#fff;" onclick="executeMove(3)">🐻 03.狗熊哆嗦毛</button>
        <button class="c-btn" style="background:#dc2626;color:#fff;" onclick="executeMove(30)">🔥 30.三十路万象归宗</button>
      </div>
    </div>
    <div class="moves-grid" id="moves-grid"></div>
  </div>

  <!-- Hilarious Glass-Splat Game Over Overlay Card -->
  <div id="gameover-overlay">
    <div class="go-stamp">💥 啪叽！闪岔气撞屏幕啦！</div>
    <div class="go-epitaph" id="go-epitaph">医生温馨提醒：非专业人士请勿盲目猛拧闪身步，小心闪着老腰 😂</div>
    <div class="go-stats">
      <div><span>最终得分</span><strong id="go-score">0</strong></div>
      <div><span>完美闪身</span><strong id="go-dodges">0 次</strong></div>
      <div><span>踢飞敌人</span><strong id="go-kills">0</strong></div>
      <div><span>挑战难度</span><strong id="go-diff">中等</strong></div>
    </div>
    <button type="button" class="btn-restart" id="btn-restart">🔄 擦擦玻璃，揉揉腰再来一局！</button>

        } else if (this.track === 'desert_snake') {
          const hijaz = [293.66, 311.13, 369.99, 392.0, 440.0, 466.16, 392.0, 369.99];
          this.playSlideTone(hijaz[s % hijaz.length], hijaz[(s + 1) % hijaz.length], 0.19, 'sawtooth', 0.05);

        osc.type = type; osc.frequency.setValueAtTime(freq, now);
        g.gain.setValueAtTime(vol, now);
        g.gain.exponentialRampToValueAtTime(0.001, now + dur);
        osc.connect(g); g.connect(this.ctx.destination);
        osc.start(now); osc.stop(now + dur);
      }
      playSlideTone(f1, f2, dur, type, vol) {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(f1, now);
        osc.frequency.exponentialRampToValueAtTime(f2, now + dur);
        g.gain.setValueAtTime(vol, now);
        g.gain.exponentialRampToValueAtTime(0.001, now + dur);
        osc.connect(g); g.connect(this.ctx.destination);
        osc.start(now); osc.stop(now + dur);

      const gridW = Math.max(280, w - sideMargin * 2);

        w: gridW,
        h: gridH,
        cellW: gridW / 3,

      document.getElementById('go-kills').textContent = state.kills;
      document.getElementById('go-diff').textContent = DIFFICULTIES[state.difficulty].label;
      document.getElementById('touch-overlay').style.display = 'none';
      document.getElementById('moves-dock').style.display = 'none';
    }

    function restartGame() {
      state.isGameOver = false;
      state.hp = state.maxHp;
      state.qi = 60;
      state.score = 0;
      state.kills = 0;
      state.perfectDodges = 0;
      state.wave = 1;
      state.goTimer = 0;
      state.goSlideY = 0;
      state.witchTimeTimer = 0;
      enemies.length = 0;
      floatingTexts.length = 0;
      shockwaves.length = 0;
      hero.col = 1; hero.row = 1;
      const c = cellCenter(1, 1);
      hero.px = c.x; hero.py = c.y;
      hero.pose = 'ready'; hero.iframeTimer = 0.6;
      document.getElementById('gameover-overlay').classList.remove('show');
      document.getElementById('touch-overlay').style.display = 'flex';
      document.getElementById('moves-dock').style.display = 'block';
      spawnEnemyWave();
      speakChineseCallout('擦干玻璃，重新开练！闪身步！');
    }
    document.getElementById('btn-restart').addEventListener('click', restartGame);

    function moveHeroGrid(dCol, dRow) {
      if (state.isGameOver) return;
      const nCol = Math.max(0, Math.min(2, hero.col + dCol));
      const nRow = Math.max(0, Math.min(2, hero.row + dRow));
      if (dCol !== 0) hero.facing = dCol > 0 ? 1 : -1;
      hero.col = nCol;
      hero.row = nRow;
    }

    function isCellDangerous(c, r) {
      return enemies.some(e => e.alive && !e.kicked && e.targetCells.some(tc => tc.c === c && tc.r === r));
    }

    function findSafeTile() {
      const candidates = [];
      for (let r = 0; r < 3; r++) {
        for (let c = 0; c < 3; c++) {
          if (c === hero.col && r === hero.row) continue;
          const danger = isCellDangerous(c, r);
          const dist = Math.abs(c - hero.col) + Math.abs(r - hero.row);
          candidates.push({ c, r, danger, dist });
        }
      }
      candidates.sort((a, b) => (a.danger - b.danger) || (a.dist - b.dist));
      return candidates[0] || { c: (hero.col + 1) % 3, r: hero.row };
    }

    // =========================================================================
    // 7. SPAWN ENEMIES (RESPECTING DIFFICULTY SETTINGS!)
    // =========================================================================
    function pickEnemyTemplate() {
      const factions = state.faction === 'mixed' ? ['dinos', 'zombies', 'mummies'] : [state.faction];
      const f = factions[Math.floor(Math.random() * factions.length)];

      if (f === 'zombies') {
        const pool = [
          { sprite: 'zombie_runner', label: '🧟 狂暴感染丧尸', hp: 120, isAir: false, isBoss: false, scale: 1.05 },
          { sprite: 'zombie_crow', label: '🦇 变异噬魂尸鸦', hp: 100, isAir: true, isBoss: false, scale: 0.95 },
          { sprite: 'zombie_brute', label: '🚧 暴君铁锤巨丧尸', hp: 330, isAir: false, isBoss: true, scale: 1.32 },
        ];
        return pool[Math.random() < 0.22 ? 2 : (Math.random() < 0.48 ? 1 : 0)];
      } else if (f === 'mummies') {
        const pool = [
          { sprite: 'mummy_runner', label: '🏺 诅咒古墓木乃伊', hp: 125, isAir: false, isBoss: false, scale: 1.05 },
          { sprite: 'mummy_scarab', label: '🪲 黄金魔甲圣甲虫', hp: 95, isAir: true, isBoss: false, scale: 0.92 },
          { sprite: 'mummy_pharaoh', label: '👑 亡灵黄金法老王', hp: 350, isAir: false, isBoss: true, scale: 1.35 },
        ];
        return pool[Math.random() < 0.22 ? 2 : (Math.random() < 0.48 ? 1 : 0)];
      } else {
        const pool = [
          { sprite: 'dino_raptor', label: '🦎 镰爪迅猛龙', hp: 120, isAir: false, isBoss: false, scale: 1.05 },
          { sprite: 'dino_triceratops', label: '🦏 重甲三角龙', hp: 190, isAir: false, isBoss: false, scale: 1.15 },
          { sprite: 'dino_pteranodon', label: '🦅 苍穹无齿翼龙', hp: 100, isAir: true, isBoss: false, scale: 1.05 },
          { sprite: 'dino_trex', label: '🦖 暴君霸王龙BOSS', hp: 360, isAir: false, isBoss: true, scale: 1.38 },
        ];
        const r = Math.random();
        return r < 0.18 ? pool[3] : (r < 0.46 ? pool[2] : (r < 0.74 ? pool[1] : pool[0]));
      }
    }

    function spawnEnemyWave() {
      if (state.isGameOver) return;
      const diff = DIFFICULTIES[state.difficulty];
      let dangerCount = 0;
      for (let rr = 0; rr < 3; rr++) {
        for (let cc = 0; cc < 3; cc++) {
          if (isCellDangerous(cc, rr)) dangerCount++;
        }
      }
      if (dangerCount >= diff.maxDangerCells) return;

      const tpl = pickEnemyTemplate();
      const dirs = tpl.isAir ? ['aerial', 'top_down', 'left_right', 'right_left'] : ['top_down', 'top_down', 'left_right', 'right_left'];
      const dir = dirs[Math.floor(Math.random() * dirs.length)];
      const col = Math.floor(Math.random() * 3);
      const row = Math.floor(Math.random() * 3);

      let startX, startY, endX, endY, facing = 1;
      const targetCells = [];

      if (dir === 'top_down') {
        const topC = cellCenter(col, 0);
        const botC = cellCenter(col, 2);
        startX = topC.x; startY = -90;
        endX = botC.x; endY = canvas.height + 110;
        facing = col <= 1 ? 1 : -1;
        for (let r = 0; r < 3; r++) targetCells.push({ c: col, r });
      } else if (dir === 'left_right') {
        const leftC = cellCenter(0, row);
        startX = -120; startY = leftC.y;
        endX = canvas.width + 120; endY = leftC.y;
        facing = 1;
        for (let c = 0; c < 3; c++) targetCells.push({ c, r: row });
      } else if (dir === 'right_left') {
        const rightC = cellCenter(2, row);
        startX = canvas.width + 120; startY = rightC.y;
        endX = -120; endY = rightC.y;
        facing = -1;
        for (let c = 0; c < 3; c++) targetCells.push({ c, r: row });
      } else {
        const tc = cellCenter(col, row);
        const fromL = Math.random() < 0.5;
        startX = fromL ? -100 : canvas.width + 100;
        startY = -80;
        endX = fromL ? canvas.width + 100 : -100;
        endY = tc.y + 180;
        facing = fromL ? 1 : -1;
        targetCells.push({ c: col, r: row });
      }

      enemies.push({
        ...tpl,
        maxHp: tpl.hp,
        dir, targetCol: col, targetRow: row, targetCells,
        x: startX, y: startY, startX, startY, endX, endY, facing,
        telegraphTimer: diff.telegraph,
        progress: 0,
        speed: (tpl.isAir ? 0.65 : (tpl.isBoss ? 0.42 : 0.56)) * diff.speedMult,
        alive: true, hitPlayer: false, kicked: false,
        kickVx: 0, kickVy: 0, rot: 0, vRot: 0, hitFlash: 0,
      });
    }

    // =========================================================================
    // 8. EXECUTE ANY OF THE 30 MOVES (PURE DODGE vs ATTACK)
    // =========================================================================
    function executeMove(moveId) {
      if (state.isGameOver) return;
      const move = MOVES_30.find(m => m.id === moveId) || MOVES_30[0];

      if (move.qiCost > 0 && state.qi < move.qiCost) {
        floatingTexts.push({ x: hero.px, y: hero.py - 80, text: `气力不足！(用【闪身步】纯躲避回气)`, color: '#38bdf8', life: 1.0 });
        return;
      }
      state.qi = Math.max(0, state.qi - move.qiCost);

      document.querySelectorAll('.move-card').forEach(c => c.classList.remove('active-move'));
      const card = document.getElementById('move-card-' + move.id);
      if (card) card.classList.add('active-move');

      if (move.kind === 'dodge') {
        const wasInDanger = isCellDangerous(hero.col, hero.row);
        for (let i = 0; i < 3; i++) {
          hero.afterimages.push({ x: hero.px - i * 18 * hero.facing, y: hero.py, facing: hero.facing, pose: 'dodge', life: 0.48 - i * 0.09 });
        }
        const safe = findSafeTile();
        if (safe.c !== hero.col) hero.facing = safe.c > hero.col ? 1 : -1;
        hero.col = safe.c;
        hero.row = safe.r;
        hero.pose = 'dodge';
        hero.poseTimer = 0.52;
        hero.iframeTimer = Math.max(hero.iframeTimer, move.iframe);
        if (move.id === 22) state.witchTimeTimer = 2.0;

        if (wasInDanger) {
          state.perfectDodges++;
          state.qi = Math.min(state.maxQi, state.qi + 25);
          state.score += 150;
          state.witchTimeTimer = Math.max(state.witchTimeTimer, 0.85);
          music.playSFX('perfect');
          speakChineseCallout(move.id === 1 ? DODGE_TAUNTS[state.perfectDodges % DODGE_TAUNTS.length] : move.voice, true);
          state.bannerText = `⚡ 极限闪身 · ${move.name}（纯躲避成功！）⚡`;
          state.bannerSub = `完美避开危险红格！气力 +25 · 得分 +150`;
          floatingTexts.push({ x: hero.px, y: hero.py - 90, text: '⚡ 极限闪身！+25气力', color: '#38bdf8', life: 1.1 });
        } else {
          music.playSFX('dodge');
          speakChineseCallout(move.voice, false);
          state.bannerText = `💨 【${move.name}】`;
          state.bannerSub = move.desc;
        }
        state.bannerKind = 'dodge';
        state.bannerTimer = 1.45;
        return; // STRICTLY ZERO DAMAGE!
      }

      // ATTACK MOVES
      hero.pose = 'kick';
      hero.poseTimer = 0.52;
      hero.iframeTimer = Math.max(hero.iframeTimer, move.iframe);
      music.playSFX('kick');
      speakChineseCallout(move.voice, move.id >= 21);

      if (move.id === 20) state.hp = Math.min(state.maxHp, state.hp + 30);
      if (move.id === 30) {
        for (let r = 0; r < 3; r++) {
          for (let c = 0; c < 3; c++) {
            const pt = cellCenter(c, r);
            hero.afterimages.push({ x: pt.x, y: pt.y, facing: c === 2 ? -1 : 1, pose: 'kick', life: 0.95 });
          }
        }
      }

      state.bannerText = `💥 【${move.name}】`;
      state.bannerSub = move.desc;
      state.bannerKind = 'attack';
      state.bannerTimer = 1.6;

      const g = getGridRect();
      let hitCount = 0;
      enemies.forEach(e => {
        if (!e.alive || e.kicked) return;
        let inRange = false;
        const distPx = Math.hypot(e.x - hero.px, e.y - hero.py);
        if (move.range === 'all') inRange = true;
        else if (move.range === 'all_air') inRange = e.isAir || distPx < g.cellW * 1.1;
        else if (move.range === 'col') inRange = (Math.abs(e.x - hero.px) < g.cellW * 0.72);
        else if (move.range === 'row') inRange = (Math.abs(e.y - hero.py) < g.cellH * 0.72);
        else inRange = distPx < Math.max(g.cellW, g.cellH) * 1.25;

        if (inRange) {
          hitCount++;
          const dmg = Math.round(move.dmg * (0.95 + Math.random() * 0.2));
          e.hp -= dmg;
          e.hitFlash = 0.16;
          shockwaves.push({ x: e.x, y: e.y, r: 18, maxR: 100, color: '#fef08a' });
          floatingTexts.push({ x: e.x, y: e.y - 60, text: `💥 ${move.voice} -${dmg}`, color: '#fef08a', life: 0.95 });

          if (e.hp <= 0) {
            e.kicked = true;
            e.kickVx = (e.x >= hero.px ? 1 : -1) * (500 + Math.random() * 250);
            e.kickVy = -620 - Math.random() * 220;
            e.vRot = (Math.random() < 0.5 ? 1 : -1) * 14;
            state.kills++;
            state.score += e.isBoss ? 800 : 250;
            state.qi = Math.min(state.maxQi, state.qi + 12);
          }
        }
      });

      if (hitCount > 0) {
        state.hitstopRemaining = 48;
        state.shakeTimer = 0.22;
        state.shakeIntensity = move.range === 'all' ? 14 : 8;
      }
    }

    // =========================================================================
    // 9. CONTROLS & UI SELECTOR BINDINGS
    // =========================================================================
    let swipeStartX = 0, swipeStartY = 0;
    canvas.addEventListener('pointerdown', e => {
      if (state.isGameOver) return;
      swipeStartX = e.clientX; swipeStartY = e.clientY;
      const g = getGridRect();
      if (e.clientX >= g.x && e.clientX <= g.x + g.w && e.clientY >= g.y && e.clientY <= g.y + g.h) {
        const c = Math.min(2, Math.max(0, Math.floor((e.clientX - g.x) / g.cellW)));
        const r = Math.min(2, Math.max(0, Math.floor((e.clientY - g.y) / g.cellH)));
        if (c !== hero.col) hero.facing = c > hero.col ? 1 : -1;
        hero.col = c; hero.row = r;
      }
    });
    canvas.addEventListener('pointerup', e => {
      if (state.isGameOver) return;
      const dx = e.clientX - swipeStartX, dy = e.clientY - swipeStartY;
      if (Math.hypot(dx, dy) > 42) {
        if (Math.abs(dx) > Math.abs(dy)) moveHeroGrid(dx > 0 ? 1 : -1, 0);
        else moveHeroGrid(0, dy > 0 ? 1 : -1);
      }
    });

    document.getElementById('dp-up').addEventListener('pointerdown', e => { e.preventDefault(); moveHeroGrid(0, -1); });
    document.getElementById('dp-down').addEventListener('pointerdown', e => { e.preventDefault(); moveHeroGrid(0, 1); });
    document.getElementById('dp-left').addEventListener('pointerdown', e => { e.preventDefault(); moveHeroGrid(-1, 0); });
    document.getElementById('dp-right').addEventListener('pointerdown', e => { e.preventDefault(); moveHeroGrid(1, 0); });

    const KEY_TO_MOVE = {
      Space: 1, ShiftLeft: 1, ShiftRight: 1,
      KeyJ: 2, KeyK: 3, Digit1: 4, Digit2: 5, Digit3: 6, Digit4: 7, Digit5: 8,
      Digit6: 9, Digit7: 10, Digit8: 11, Digit9: 12, KeyL: 13, KeyU: 14, KeyI: 15,
      KeyO: 16, KeyP: 17, KeyF: 18, KeyG: 19, KeyR: 20, KeyZ: 21, KeyX: 22,
      KeyC: 23, KeyV: 24, KeyB: 25, KeyN: 26, KeyM: 27, KeyT: 28, KeyY: 29, KeyQ: 30, KeyE: 30
    };
    window.addEventListener('keydown', e => {
      if (state.isGameOver) {
        if (e.code === 'Enter' || e.code === 'Space') restartGame();
        return;
      }
      if (e.code === 'KeyW' || e.code === 'ArrowUp') { e.preventDefault(); moveHeroGrid(0, -1); }
      else if (e.code === 'KeyS' || e.code === 'ArrowDown') { e.preventDefault(); moveHeroGrid(0, 1); }
      else if (e.code === 'KeyA' || e.code === 'ArrowLeft') { e.preventDefault(); moveHeroGrid(-1, 0); }
      else if (e.code === 'KeyD' || e.code === 'ArrowRight') { e.preventDefault(); moveHeroGrid(1, 0); }
      else if (KEY_TO_MOVE[e.code]) { e.preventDefault(); executeMove(KEY_TO_MOVE[e.code]); }
    });

    // =========================================================================
    // 10. RENDERERS: SCROLLING BACKGROUNDS, FULL-SCREEN 3x3 GRID, HERO, ENEMIES
    //     & HILARIOUS GLASS-SPLAT CROOKED-FACE GAME OVER SCENE!
    // =========================================================================
    function drawScrollingWorld(ctx, w, h, scrollY) {
      if (state.world === 'city') {
        ctx.fillStyle = '#0f172a';
        ctx.fillRect(0, 0, w, h);
        const roadW = w * 0.80;
        const roadX = (w - roadW) * 0.5;
        ctx.fillStyle = '#334155';
        ctx.fillRect(0, 0, roadX, h);
        ctx.fillRect(roadX + roadW, 0, w - roadX - roadW, h);

        const blockH = 160;
        const offset = scrollY % blockH;
        const neonColors = ['#ec4899', '#38bdf8', '#facc15', '#22c55e'];
        for (let y = -blockH + offset; y < h + blockH; y += blockH) {
          const idx = Math.abs(Math.floor((y - offset) / blockH)) % 4;
          ctx.fillStyle = idx % 2 === 0 ? '#1e293b' : '#1e1b4b';
          ctx.strokeStyle = '#475569'; ctx.lineWidth = 3;
          ctx.fillRect(8, y + 8, Math.max(24, roadX - 24), blockH - 18);
          ctx.strokeRect(8, y + 8, Math.max(24, roadX - 24), blockH - 18);
          ctx.fillStyle = neonColors[idx];
          ctx.fillRect(roadX - 18, y + 44, 16, 48);

          ctx.fillStyle = idx % 2 === 0 ? '#1e1b4b' : '#1e293b';
          ctx.fillRect(roadX + roadW + 16, y + 8, Math.max(24, w - roadX - roadW - 24), blockH - 18);
          ctx.strokeRect(roadX + roadW + 16, y + 8, Math.max(24, w - roadX - roadW - 24), blockH - 18);
          ctx.fillStyle = neonColors[(idx + 2) % 4];
          ctx.fillRect(roadX + roadW + 2, y + 44, 16, 48);
        }

        ctx.fillStyle = '#18181b';
        ctx.fillRect(roadX, 0, roadW, h);
        ctx.strokeStyle = '#facc15'; ctx.lineWidth = 5;
        ctx.setLineDash([42, 42]); ctx.lineDashOffset = -scrollY;
        ctx.beginPath();
        ctx.moveTo(roadX + roadW * 0.333, 0); ctx.lineTo(roadX + roadW * 0.333, h);
        ctx.moveTo(roadX + roadW * 0.666, 0); ctx.lineTo(roadX + roadW * 0.666, h);
        ctx.stroke();
        ctx.setLineDash([]);
      } else {
        const bgKey = state.world === 'desert' ? 'bg_desert' : (state.world === 'studio' ? 'bg_studio' : 'bg_jurassic');
        const img = ASSETS[bgKey];
        if (img && img.complete && img.naturalWidth > 0) {
          const pulse = 1.02 + Math.sin(scrollY * 0.008) * 0.015;
          const scale = Math.max(w / img.naturalWidth, h / img.naturalHeight) * pulse;
          const dw = img.naturalWidth * scale;
          const dh = img.naturalHeight * scale;
          ctx.drawImage(img, (w - dw) * 0.5, (h - dh) * 0.5, dw, dh);
        } else {
          ctx.fillStyle = '#1c1917'; ctx.fillRect(0, 0, w, h);
        }
        // Downward running speed lines across full screen
        ctx.save();
        ctx.strokeStyle = state.world === 'desert' ? 'rgba(254, 240, 138, 0.24)' : 'rgba(255, 255, 255, 0.20)';
        ctx.lineWidth = 3;
        for (let i = 0; i < 9; i++) {
          const lx = (w * 0.08) + (i / 8) * (w * 0.84);
          const ly = ((scrollY * 1.55 + i * 160) % (h + 120)) - 60;
          ctx.beginPath(); ctx.moveTo(lx, ly); ctx.lineTo(lx, ly + 52); ctx.stroke();
        }
        ctx.restore();
        ctx.fillStyle = 'rgba(0, 0, 0, 0.18)';
        ctx.fillRect(0, 0, w, h);
      }
    }

    function drawFullScreen3x3Grid(ctx, t) {
      const g = getGridRect();
      ctx.save();
      // Subtle translucent full-screen 3x3 grid dividers so the background art shines through!
      ctx.strokeStyle = 'rgba(245, 158, 11, 0.45)';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.roundRect(g.x, g.y, g.w, g.h, 14);
      ctx.stroke();

      const rowLabels = ['上排', '中排', '下排'];
      const colLabels = ['左', '中', '右'];

      for (let r = 0; r < 3; r++) {
        for (let c = 0; c < 3; c++) {
          const cx = g.x + c * g.cellW;
          const cy = g.y + r * g.cellH;
          const isHeroCell = (hero.col === c && hero.row === r);
          const threats = enemies.filter(e => e.alive && !e.kicked && e.targetCells.some(tc => tc.c === c && tc.r === r));
          const isDanger = threats.length > 0;

          if (isDanger) {
            const pulse = 0.22 + Math.abs(Math.sin(t * 14)) * 0.30;
            ctx.fillStyle = `rgba(239, 68, 68, ${pulse})`;
            ctx.strokeStyle = 'rgba(239, 68, 68, 0.92)';
            ctx.lineWidth = 3;
          } else if (isHeroCell) {
            ctx.fillStyle = hero.iframeTimer > 0 ? 'rgba(56, 189, 248, 0.22)' : 'rgba(245, 158, 11, 0.14)';
            ctx.strokeStyle = hero.iframeTimer > 0 ? '#38bdf8' : 'rgba(245, 158, 11, 0.85)';
            ctx.lineWidth = 3;
          } else {
            ctx.fillStyle = 'rgba(9, 13, 24, 0.12)';
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.22)';
            ctx.lineWidth = 1.5;
          }

          ctx.beginPath();
          ctx.roundRect(cx + 5, cy + 5, g.cellW - 10, g.cellH - 10, 12);
          ctx.fill();
          ctx.stroke();

          ctx.font = 'bold 11px "Microsoft YaHei"';
          ctx.fillStyle = 'rgba(255,255,255,0.48)';
          ctx.textAlign = 'left';
          ctx.fillText(`${rowLabels[r]}·${colLabels[c]}`, cx + 14, cy + 22);

          if (isDanger) {
            const dirIcon = threats[0].dir === 'top_down' ? '⬇' : (threats[0].dir === 'left_right' ? '➡' : (threats[0].dir === 'right_left' ? '⬅' : '🎯'));
            ctx.font = '900 32px "Segoe UI Emoji", sans-serif';
            ctx.fillStyle = '#fef08a';
            ctx.textAlign = 'center';
            ctx.fillText(dirIcon, cx + g.cellW * 0.5, cy + g.cellH * 0.58);
          }
        }
      }
      ctx.restore();
    }

    function drawHero(ctx, x, y, facing, pose, alpha = 1.0, isGhost = false, t = 0) {
      const img = pose === 'kick' ? ASSETS.hero_kick : (pose === 'dodge' ? ASSETS.hero_dodge : ASSETS.hero_ready);
      if (!img || !img.complete || img.naturalWidth === 0) return;
      const g = getGridRect();
      const drawH = Math.min(185, g.cellH * 1.05);
      const drawW = (img.naturalWidth / img.naturalHeight) * drawH;

      const runBob = pose === 'ready' ? Math.abs(Math.sin(t * 14)) * 11 : 0;
      const runTilt = pose === 'ready' ? Math.sin(t * 14) * 0.06 : 0;

      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.translate(x, y + g.cellH * 0.38);

      if (!isGhost) {
        ctx.fillStyle = 'rgba(0,0,0,0.48)';
        ctx.beginPath(); ctx.ellipse(0, 0, drawW * 0.38, 12, 0, 0, Math.PI * 2); ctx.fill();
        if (pose === 'ready') {
          ctx.fillStyle = 'rgba(254, 243, 199, 0.36)';
          const dOff = (t * 85) % 26;
          ctx.beginPath(); ctx.arc(-16, 4 + dOff * 0.5, 5.5, 0, Math.PI * 2); ctx.fill();
          ctx.beginPath(); ctx.arc(16, 12 - dOff * 0.4, 4.5, 0, Math.PI * 2); ctx.fill();
        }
      }

      ctx.translate(0, -runBob);
      ctx.rotate(runTilt);
      ctx.scale(facing, 1);

      if (isGhost) ctx.filter = 'hue-rotate(175deg) brightness(1.45) saturate(2.5)';
      ctx.drawImage(img, -drawW * 0.5, -drawH + 6, drawW, drawH);
      ctx.filter = 'none';

      if (state.customHeadImg && !isGhost) {
        const headY = pose === 'kick' ? -drawH * 0.74 : -drawH * 0.78;
        const headR = drawH * 0.14;
        ctx.save();
        ctx.beginPath(); ctx.arc(0, headY, headR, 0, Math.PI * 2); ctx.clip();
        ctx.drawImage(state.customHeadImg, -headR, headY - headR, headR * 2, headR * 2);
        ctx.restore();
      }

      if (!isGhost && pose === 'kick') {
        ctx.strokeStyle = '#fef08a'; ctx.lineWidth = 7;
        ctx.shadowColor = '#f59e0b'; ctx.shadowBlur = 18;
        ctx.beginPath(); ctx.arc(drawW * 0.15, -drawH * 0.55, drawH * 0.5, -1.2, 0.6); ctx.stroke();
        ctx.shadowBlur = 0;
      }
      ctx.restore();
    }

    function drawEnemy(ctx, e, t) {
      const img = ASSETS[e.sprite];
      if (!img || !img.complete || img.naturalWidth === 0) return;
      const g = getGridRect();
      const baseH = Math.min(175, g.cellH * 0.96) * e.scale;
      const drawW = (img.naturalWidth / img.naturalHeight) * baseH;
      const drawH = baseH;

      ctx.save();
      ctx.translate(e.x, e.y);
      if (e.rot !== 0) ctx.rotate(e.rot);
      const bob = Math.abs(Math.sin(t * 11)) * 8;
      ctx.translate(0, -bob);
      ctx.scale(e.facing, 1);
      if (e.hitFlash > 0) ctx.filter = 'brightness(2.5) contrast(1.4)';
      ctx.drawImage(img, -drawW * 0.5, -drawH * 0.62, drawW, drawH);
      ctx.filter = 'none';
      ctx.restore();

      if (!e.kicked) {
        const bw = e.isBoss ? 104 : 66;
        const by = e.y - drawH * 0.66 - 10;
        ctx.fillStyle = 'rgba(0,0,0,0.78)';
        ctx.fillRect(e.x - bw * 0.5, by, bw, 7);
        ctx.fillStyle = e.isBoss ? '#ef4444' : '#22c55e';
        ctx.fillRect(e.x - bw * 0.5, by, bw * Math.max(0, e.hp / e.maxHp), 7);
        ctx.font = 'bold 11.5px "Microsoft YaHei"';
        ctx.textAlign = 'center';
        ctx.strokeStyle = '#000'; ctx.lineWidth = 3.5;
        ctx.strokeText(e.label, e.x, by - 4);
        ctx.fillStyle = e.isBoss ? '#fca5a5' : '#fef08a';
        ctx.fillText(e.label, e.x, by - 4);
      }
    }

    // =========================================================================
    // 11. HILARIOUS GAME-OVER GLASS-SPLAT SCENE ("主角飞向屏幕 -> 脸歪歪撞在玻璃上 -> 慢慢滑下去!")
    // =========================================================================
    function drawHilariousGameOverSplat(ctx, w, h, goTimer, t) {
      const cx = w * 0.5;
      const cy = h * 0.44;

      if (goTimer < 0.42) {
        // PHASE 1: Hero spinning and flying straight AT THE CAMERA!
        const p = goTimer / 0.42;
        const img = ASSETS.hero_dodge;
        if (img && img.complete) {
          const s = 0.6 + p * p * 3.8;
          ctx.save();
          ctx.translate(hero.px + (cx - hero.px) * p, hero.py + (cy - hero.py) * p);
          ctx.rotate(p * Math.PI * 5.2);
          const sz = 160 * s;
          ctx.drawImage(img, -sz * 0.5, -sz * 0.5, sz, sz);
          ctx.restore();
        }
        return;
      }

      // Trigger SPLAT impact sound & shake once at t = 0.42s!
      if (!state.goSplatPlayed) {
        state.goSplatPlayed = true;
        state.shakeTimer = 0.35;
        state.shakeIntensity = 24;
        music.playSFX('glass_splat');
        setTimeout(() => document.getElementById('gameover-overlay').classList.add('show'), 480);
      }

      // PHASE 2 & 3: SPLAT! Cracked Glass + Squished Crooked Face Slowly Sliding Down!
      const slideTime = Math.max(0, goTimer - 0.55);
      const slideY = Math.min(h * 0.24, slideTime * 46); // Squeaky slow slide down the camera glass!

      // Dark dramatic spotlight tint
      ctx.fillStyle = 'rgba(0, 0, 0, 0.46)';
      ctx.fillRect(0, 0, w, h);

      // Foggy vertical streak left behind on the glass as his face & palms slide down!
      if (slideY > 4) {
        ctx.fillStyle = 'rgba(255, 255, 255, 0.14)';
        ctx.beginPath();
        ctx.roundRect(cx - 120, cy - 115, 240, slideY + 120, 90);
        ctx.fill();
      }

      // Spiderweb Glass Crack Radiating from Impact Point!
      ctx.save();
      ctx.translate(cx, cy - 15);
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.78)';
      ctx.lineWidth = 3;
      for (let a = 0; a < 12; a++) {
        const ang = (a / 12) * Math.PI * 2 + 0.15;
        const len = 155 + (a % 3) * 75;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(Math.cos(ang) * len * 0.5, Math.sin(ang) * len * 0.5);
        ctx.lineTo(Math.cos(ang + 0.08) * len, Math.sin(ang + 0.08) * len);
        ctx.stroke();
      }
      [55, 115, 175].forEach(rad => {
        ctx.beginPath(); ctx.arc(0, 0, rad, 0, Math.PI * 2); ctx.lineWidth = 1.6; ctx.stroke();
      });
      ctx.restore();

      // SQUISHED COMIC HERO PRESSED FLAT AGAINST THE GLASS!
      ctx.save();
      ctx.translate(cx, cy + slideY);

      // Giant Squished Palms Pressed Against Glass (左右两只紧贴玻璃的巴掌!)
      [-175, 175].forEach((px, idx) => {
        ctx.save();
        ctx.translate(px, 24 + (idx === 0 ? -10 : 12));
        ctx.rotate(idx === 0 ? -0.35 : 0.35);
        ctx.fillStyle = '#e8a274';
        ctx.strokeStyle = '#18181b';
        ctx.lineWidth = 5;
        // Palm
        ctx.beginPath(); ctx.ellipse(0, 12, 42, 48, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        // 5 Splayed Fingers Pressed Flat!
        [-28, -12, 4, 20, 34].forEach((fx, fi) => {
          ctx.beginPath(); ctx.roundRect(fx - 8, -56 + Math.abs(fi - 2) * 8, 16, 48, 8); ctx.fill(); ctx.stroke();
        });
        ctx.restore();
      });

      // Black Tank Top Shoulders Pressed Flat Behind Face
      ctx.fillStyle = '#18181b';
      ctx.strokeStyle = '#09090b';
      ctx.lineWidth = 6;
      ctx.beginPath();
      ctx.ellipse(0, 150, 145, 95, 0, 0, Math.PI * 2);
      ctx.fill(); ctx.stroke();
      // Red Waist Sash Peek
      ctx.fillStyle = '#dc2626';
      ctx.fillRect(-100, 195, 200, 26);

      // GIANT CROOKED SQUISHED FACE PRESSED FLAT AGAINST SCREEN GLASS!
      ctx.save();
      ctx.scale(1.18, 0.90); // Flattened horizontally against the glass!
      ctx.rotate(-0.14);     // Crooked tilted face ("脸歪歪地撞到屏幕上")!

      if (state.customHeadImg) {
        // If user uploaded their own face photo, squish & tilt THEIR photo against the cracked glass!!
        ctx.save();
        ctx.beginPath(); ctx.ellipse(0, 0, 112, 120, 0, 0, Math.PI * 2); ctx.clip();
        ctx.drawImage(state.customHeadImg, -118, -126, 236, 252);
        ctx.restore();
        ctx.strokeStyle = '#18181b'; ctx.lineWidth = 7;
        ctx.beginPath(); ctx.ellipse(0, 0, 112, 120, 0, 0, Math.PI * 2); ctx.stroke();
      } else {
        // Squished Black-Tank-Top Master Face Close-Up!
        ctx.fillStyle = '#f3b282';
        ctx.strokeStyle = '#18181b';
        ctx.lineWidth = 7;
        ctx.beginPath();
        // Lumpy squished cheek outline
        ctx.moveTo(-98, -28);
        ctx.quadraticCurveTo(-116, 60, -68, 108);
        ctx.quadraticCurveTo(10, 126, 84, 96);
        ctx.quadraticCurveTo(118, 34, 96, -42);
        ctx.quadraticCurveTo(64, -122, -6, -120);
        ctx.quadraticCurveTo(-84, -118, -98, -28);
        ctx.closePath();
        ctx.fill(); ctx.stroke();

        // Buzz-cut Black Hair
        ctx.fillStyle = '#18181b';
        ctx.beginPath();
        ctx.ellipse(-2, -88, 92, 42, -0.05, Math.PI, Math.PI * 2);
        ctx.fill();

        // Squished Flat Reddish Nose Smushed Sideways Against Glass!
        ctx.fillStyle = '#e07a5f';
        ctx.strokeStyle = '#7c2d12';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.ellipse(8, 10, 26, 17, 0.25, 0, Math.PI * 2);
        ctx.fill(); ctx.stroke();

        // Hilarious Crooked Eyes: One Big Dizzy Spiral Eye + One Tightly Squinted "><" Eye!
        // Left Eye: Spiral Dizzy
        ctx.fillStyle = '#ffffff';
        ctx.strokeStyle = '#09090b'; ctx.lineWidth = 5;
        ctx.beginPath(); ctx.arc(-44, -26, 24, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        ctx.strokeStyle = '#09090b'; ctx.lineWidth = 4;
        ctx.beginPath();
        for (let a = 0; a < 14; a++) {
          const rad = a * 1.4;
          const sx = -44 + Math.cos(a + t * 8) * rad;
          const sy = -26 + Math.sin(a + t * 8) * rad;
          if (a === 0) ctx.moveTo(sx, sy); else ctx.lineTo(sx, sy);
        }
        ctx.stroke();

        // Right Eye: Squinted Tightly Shut (><)
        ctx.strokeStyle = '#09090b'; ctx.lineWidth = 7; ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(22, -38); ctx.lineTo(56, -24); ctx.lineTo(24, -10);
        ctx.stroke();

        // Hilarious Crooked Smushed Wavy Mouth Pressed Against Glass + Little Tongue Sticking Out!
        ctx.fillStyle = '#7f1d1d';
        ctx.strokeStyle = '#09090b'; ctx.lineWidth = 5;
        ctx.beginPath();
        ctx.ellipse(18, 62, 46, 20, -0.18, 0, Math.PI * 2);
        ctx.fill(); ctx.stroke();
        // Pink tongue squished sideways
        ctx.fillStyle = '#fb7185';
        ctx.beginPath(); ctx.ellipse(42, 74, 18, 13, 0.3, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      }
      ctx.restore(); // End squished face

      // Orbiting Dizzy Golden Stars & Sweat Drops Around Head!
      for (let s = 0; s < 5; s++) {
        const ang = t * 4.5 + (s / 5) * Math.PI * 2;
        const sx = Math.cos(ang) * 140;
        const sy = -132 + Math.sin(ang) * 26;
        ctx.font = 'bold 28px "Segoe UI Emoji"';
        ctx.textAlign = 'center';
        ctx.fillText(s % 2 === 0 ? '⭐' : '💫', sx, sy);
      }

      // Comic "啪叽！SPLAT!" Impact Sound Word!
      ctx.save();
      ctx.translate(155, -105);
      ctx.rotate(0.18);
      ctx.font = '900 42px "Microsoft YaHei"';
      ctx.strokeStyle = '#09090b'; ctx.lineWidth = 8;
      ctx.strokeText('啪叽!!', 0, 0);
      ctx.fillStyle = '#fef08a';
      ctx.fillText('啪叽!!', 0, 0);
      ctx.restore();

      ctx.restore();
    }

    // =========================================================================
    // 12. MAIN 60FPS GAME LOOP
    // =========================================================================
    spawnEnemyWave();
    let lastTime = performance.now();
    let fpsFrames = 0, fpsTimer = 0;
    let spawnTimer = 1.4;
    let aiCooldown = 0;

    function loop(now) {
      requestAnimationFrame(loop);
      const rawDt = Math.min((now - lastTime) / 1000, 0.1);
      lastTime = now;
      const t = now * 0.001;

      fpsFrames++;
      fpsTimer += rawDt;
      if (fpsTimer >= 0.5) {
        state.fps = Math.min(60, Math.round(fpsFrames / fpsTimer));
        document.getElementById('fps-val').textContent = state.fps + ' OK';
        fpsFrames = 0; fpsTimer = 0;
      }

      if (state.hitstopRemaining > 0) {
        state.hitstopRemaining -= rawDt * 1000;
        return;
      }

      const dt = rawDt;
      const diff = DIFFICULTIES[state.difficulty];

      if (state.isGameOver) {
        state.goTimer += dt;
      } else {
        if (state.witchTimeTimer > 0) state.witchTimeTimer = Math.max(0, state.witchTimeTimer - rawDt);
        const enemyDt = state.witchTimeTimer > 0 ? rawDt * 0.3 : rawDt;

        state.scrollY += 235 * dt * (diff.speedMult * 0.85 + 0.15);

        const targetPt = cellCenter(hero.col, hero.row);
        hero.px += (targetPt.x - hero.px) * Math.min(1, dt * 18);
        hero.py += (targetPt.y - hero.py) * Math.min(1, dt * 18);

        if (hero.poseTimer > 0) {
          hero.poseTimer -= dt;
          if (hero.poseTimer <= 0) hero.pose = 'ready';
        }
        if (hero.iframeTimer > 0) hero.iframeTimer -= dt;

        if (state.autoBot) {
          aiCooldown -= dt;
          if (aiCooldown <= 0) {
            if (isCellDangerous(hero.col, hero.row)) {
              executeMove(1);
              aiCooldown = 0.62;
            } else if (enemies.some(e => e.alive && !e.kicked && e.telegraphTimer <= 0)) {
              executeMove(Math.random() < 0.65 ? 2 : 3);
              aiCooldown = 0.92;
            }
          }
        }

        spawnTimer -= enemyDt;
        if (spawnTimer <= 0) {
          spawnEnemyWave();
          if (Math.random() < diff.doubleSpawnChance) spawnEnemyWave();
          spawnTimer = diff.spawnSec;
        }

        const g = getGridRect();
        for (let i = enemies.length - 1; i >= 0; i--) {
          const e = enemies[i];
          if (e.hitFlash > 0) e.hitFlash -= dt;

          if (e.kicked) {
            e.x += e.kickVx * dt;
            e.y += e.kickVy * dt;
            e.kickVy += 920 * dt;
            e.rot += e.vRot * dt;
            if (e.x < -280 || e.x > canvas.width + 280 || e.y > canvas.height + 280 || e.y < -380) {
              enemies.splice(i, 1);
            }
            continue;
          }

          if (e.telegraphTimer > 0) {
            e.telegraphTimer -= enemyDt;
            continue;
          }

          e.progress += e.speed * enemyDt;
          e.x = e.startX + (e.endX - e.startX) * e.progress;
          e.y = e.startY + (e.endY - e.startY) * e.progress;

          if (!e.hitPlayer && Math.hypot(e.x - hero.px, e.y - hero.py) < Math.min(g.cellW, g.cellH) * 0.48) {
            if (hero.iframeTimer > 0) {
              e.hitPlayer = true;
            } else {
              e.hitPlayer = true;
              const dmgTaken = e.isBoss ? diff.dmgBoss : diff.dmgNormal;
              // REAL HP REDUCTION ALL THE WAY TO 0!
              state.hp = Math.max(0, state.hp - dmgTaken);
              state.shakeTimer = 0.24;
              state.shakeIntensity = 12;
              music.playSFX('hurt');
              floatingTexts.push({ x: hero.px, y: hero.py - 85, text: `💢 -${dmgTaken} HP！快按【闪身步】！`, color: '#ef4444', life: 0.95 });

              if (state.hp <= 0) {
                triggerHilariousGameOver(e.label);
              }
            }
          }

          if (e.progress >= 1.06) {
            enemies.splice(i, 1);
            state.score += 30;
          }
        }
      }

      // =======================================================================
      // RENDER FRAME
      // =======================================================================
      ctx.save();
      if (state.shakeTimer > 0) {
        state.shakeTimer -= dt;
        ctx.translate((Math.random() - 0.5) * state.shakeIntensity, (Math.random() - 0.5) * state.shakeIntensity);
      }

      drawScrollingWorld(ctx, canvas.width, canvas.height, state.scrollY);
      drawFullScreen3x3Grid(ctx, t);

      if (state.witchTimeTimer > 0 && !state.isGameOver) {
        ctx.fillStyle = 'rgba(30, 27, 75, 0.26)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }

      for (let i = hero.afterimages.length - 1; i >= 0; i--) {
        const a = hero.afterimages[i];
        a.life -= dt;
        if (a.life <= 0) { hero.afterimages.splice(i, 1); continue; }
        drawHero(ctx, a.x, a.y, a.facing, a.pose, a.life * 0.72, true, t);
      }

      const drawables = [
        ...(state.isGameOver ? [] : [{ y: hero.py, fn: () => drawHero(ctx, hero.px, hero.py, hero.facing, hero.pose, 1.0, false, t) }]),
        ...enemies.filter(e => e.telegraphTimer <= 0 || e.kicked).map(e => ({ y: e.y, fn: () => drawEnemy(ctx, e, t) }))
      ].sort((a, b) => a.y - b.y);
      drawables.forEach(d => d.fn());

      for (let i = shockwaves.length - 1; i >= 0; i--) {
        const s = shockwaves[i];
        s.r += dt * 360;
        if (s.r >= s.maxR) { shockwaves.splice(i, 1); continue; }
        ctx.strokeStyle = s.color; ctx.lineWidth = 4.5;
        ctx.globalAlpha = 1 - s.r / s.maxR;
        ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.stroke();
        ctx.globalAlpha = 1;
      }

      for (let i = floatingTexts.length - 1; i >= 0; i--) {
        const ft = floatingTexts[i];
        ft.life -= dt; ft.y -= 44 * dt;
        if (ft.life <= 0) { floatingTexts.splice(i, 1); continue; }
        ctx.save();
        ctx.globalAlpha = Math.min(1, ft.life * 1.5);
        ctx.font = '900 15px "Microsoft YaHei"';
        ctx.textAlign = 'center';
        ctx.strokeStyle = '#000'; ctx.lineWidth = 4;
        ctx.strokeText(ft.text, ft.x, ft.y);
        ctx.fillStyle = ft.color;
        ctx.fillText(ft.text, ft.x, ft.y);
        ctx.restore();
      }

      if (state.bannerTimer > 0 && !state.isGameOver) {
        state.bannerTimer -= dt;
        const by = 44;
        ctx.save();
        ctx.globalAlpha = Math.min(1, state.bannerTimer * 2.2);
        ctx.font = 'bold 11px "Microsoft YaHei"';
        const sw = ctx.measureText(state.bannerSub).width;
        const safeBw = Math.max(300, Math.min(canvas.width - 610, Math.max(320, sw + 34)));
        ctx.fillStyle = state.bannerKind === 'dodge' ? 'rgba(3, 105, 161, 0.90)' : 'rgba(154, 52, 18, 0.90)';
        ctx.strokeStyle = state.bannerKind === 'dodge' ? '#38bdf8' : '#f59e0b';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.roundRect(canvas.width * 0.5 - safeBw * 0.5, by - 24, safeBw, 48, 10);
        ctx.fill(); ctx.stroke();

        ctx.font = '900 16.5px "Microsoft YaHei"';
        ctx.fillStyle = '#fef08a'; ctx.textAlign = 'center';
        ctx.fillText(state.bannerText, canvas.width * 0.5, by - 3);

        ctx.font = 'bold 10.5px "Microsoft YaHei"';
        ctx.fillStyle = '#f0f9ff';
        ctx.fillText(state.bannerSub.slice(0, 44), canvas.width * 0.5, by + 15);
        ctx.restore();
      }

      // Render Hilarious Game Over Glass-Splat Scene on Top of Everything!
      if (state.isGameOver) {
        drawHilariousGameOverSplat(ctx, canvas.width, canvas.height, state.goTimer, t);
      }

      ctx.restore();

      // Update DOM HUD
      document.getElementById('hp-bar').style.width = ((state.hp / state.maxHp) * 100) + '%';
      document.getElementById('hp-text').textContent = Math.round(state.hp) + '/' + state.maxHp;
      document.getElementById('qi-bar').style.width = ((state.qi / state.maxQi) * 100) + '%';
      document.getElementById('qi-text').textContent = Math.round(state.qi) + '/' + state.maxQi;
      document.getElementById('dodge-val').textContent = state.perfectDodges + ' 次';
      document.getElementById('kills-val').textContent = state.kills;
      document.getElementById('score-val').textContent = state.score;

      state.framesRendered++;
    }

    requestAnimationFrame(loop);
  </script>
</body>
</html>
