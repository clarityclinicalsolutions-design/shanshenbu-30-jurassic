<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>《闪身步30招：智斗侏罗纪》 — 2D 街机手绘精版 (恐龙快打 × 花鼓灯宗师)</title>
  <style>
    :root {
      --gold: #f59e0b;
      --crimson: #ef4444;
      --cyan: #38bdf8;
      --bg-card: rgba(15, 12, 10, 0.85);
      --border-gold: rgba(245, 158, 11, 0.52);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
    body, html {
      width: 100%; height: 100%; overflow: hidden;
      background: #0c0a09; color: #fafaf9;
      font-family: 'Microsoft YaHei', 'Segoe UI', system-ui, sans-serif;
    }
    #game-canvas {
      position: absolute; inset: 0; width: 100%; height: 100%; display: block;
    }

    /* Top HUD */
    .hud-top {
      position: absolute; top: 8px; left: 8px; right: 8px;
      display: flex; justify-content: space-between; align-items: flex-start;
      pointer-events: none; z-index: 12; gap: 8px;
    }
    .hud-card {
      background: var(--bg-card); backdrop-filter: blur(10px);
      border: 1px solid var(--border-gold); border-radius: 11px;
      padding: 8px 11px; pointer-events: auto;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.65);
    }
    .title-row {
      display: flex; align-items: center; gap: 7px;
      font-size: 13.5px; font-weight: 900; color: var(--gold);
    }
    .sub-tag {
      font-size: 10px; padding: 1px 7px; border-radius: 99px;
      background: rgba(16, 185, 129, 0.22); color: #6ee7b7; border: 1px solid rgba(16,185,129,0.45);
    }
    .bars-box { margin-top: 5px; display: flex; flex-direction: column; gap: 4px; min-width: 210px; }
    .bar-line { display: flex; align-items: center; gap: 6px; font-size: 10.5px; font-weight: 700; }
    .bar-bg { flex: 1; height: 8px; background: rgba(255,255,255,0.14); border-radius: 99px; overflow: hidden; }
    .bar-fg { height: 100%; transition: width 0.14s ease-out; border-radius: 99px; }
    .hp-fg { background: linear-gradient(90deg, #dc2626, #f59e0b); width: 100%; }
    .metrics-row {
      display: grid; grid-template-columns: repeat(4, auto); gap: 10px;
      margin-top: 5px; font-size: 10.5px;
    }
    .m-cell span { font-size: 9px; color: #a8a29e; display: block; }
    .m-cell strong { font-size: 12.5px; color: #fff; }

    /* Right Panel: Character Workshop & Stage Switcher */
    .hud-right {
      width: 268px; display: flex; flex-direction: column; gap: 5px;
    }
    .panel-head {
      display: flex; justify-content: space-between; align-items: center;
      font-size: 11px; font-weight: 800; color: var(--gold);
    }
    .customizer-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 4px; margin-top: 2px;
    }
    .c-btn {
      padding: 4px 6px; font-size: 10px; font-weight: 700;
      border-radius: 6px; border: 1px solid rgba(245, 158, 11, 0.35);
      background: rgba(255, 255, 255, 0.08); color: #fef3c7; cursor: pointer;
      transition: all 0.14s; text-align: center; white-space: nowrap;
    }
    .c-btn:hover, .c-btn.active {
      background: var(--gold); color: #0c0a09; border-color: #fff;
    }

    /* Bottom Deck: Complete 30 Moves Wheel / Deck Bar */
    .moves-dock {
      position: absolute; bottom: 6px; left: 8px; right: 8px; z-index: 12;
      background: var(--bg-card); backdrop-filter: blur(12px);
      border: 1px solid var(--border-gold); border-radius: 11px;
      padding: 6px 9px; pointer-events: auto;
    }
    .dock-header {
      display: flex; justify-content: space-between; align-items: center;
      flex-wrap: wrap; gap: 5px; margin-bottom: 5px; font-size: 10.5px;
    }
    .stance-tabs { display: flex; gap: 4px; flex-wrap: wrap; }
    .stance-tab {
      padding: 2px 8px; border-radius: 99px; font-size: 10px; font-weight: 700;
      background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.16);
      color: #e7e5e4; cursor: pointer;
    }
    .stance-tab.active {
      background: var(--gold); color: #0c0a09; border-color: #fff;
    }
    .moves-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(132px, 1fr));
      gap: 4px; max-height: 76px; overflow-y: auto; padding-right: 4px;
    }
    .move-card {
      background: rgba(28, 25, 23, 0.94);
      border: 1px solid rgba(245, 158, 11, 0.28);
      border-radius: 6px; padding: 4px 6px; cursor: pointer;
      transition: all 0.12s;
    }
    .move-card:hover {
      border-color: var(--gold); background: rgba(245, 158, 11, 0.2);
    }
    .move-card.active-move {
      border-color: #38bdf8; box-shadow: 0 0 10px rgba(56, 189, 248, 0.55);
      background: rgba(14, 165, 233, 0.26);
    }
    .move-card .m-name { font-size: 10.5px; font-weight: 800; color: #fef08a; }
    .move-card .m-meta {
      font-size: 9px; color: #a8a29e; display: flex; justify-content: space-between; margin-top: 1px;
    }

    /* Mobile Virtual Touch Controls */
    #mobile-controls {
      position: absolute; bottom: 112px; left: 14px; right: 14px;
      display: none; justify-content: space-between; align-items: flex-end;
      pointer-events: none; z-index: 18;
    }
    body.touch-enabled #mobile-controls { display: flex; }
    @media (hover: none) and (pointer: coarse), (max-width: 820px) {
      #mobile-controls { display: flex; }
    }
    .joy-zone {
      width: 102px; height: 102px; border-radius: 50%;
      background: rgba(12, 10, 9, 0.55); border: 2px solid rgba(245, 158, 11, 0.6);
      position: relative; pointer-events: auto; touch-action: none;
    }
    .joy-knob {
      width: 40px; height: 40px; border-radius: 50%;
      background: radial-gradient(circle, #fef08a, #f59e0b);
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 12px rgba(245, 158, 11, 0.85);
    }
    .touch-btns {
      display: flex; gap: 8px; align-items: flex-end; pointer-events: auto;
    }
    .t-circle-btn {
      width: 58px; height: 58px; border-radius: 50%;
      border: 2px solid #fff; font-weight: 900; font-size: 12px;
      color: #0c0a09; display: flex; flex-direction: column;
      align-items: center; justify-content: center; cursor: pointer;
      box-shadow: 0 6px 18px rgba(0,0,0,0.65); touch-action: manipulation;
    }
    .t-circle-btn small { font-size: 8.5px; font-weight: 700; }
    .t-btn-dodge { background: linear-gradient(135deg, #fef08a, #f59e0b); }
    .t-btn-kick { background: linear-gradient(135deg, #7dd3fc, #0284c7); color: #fff; width: 66px; height: 66px; }
    .t-btn-ult { background: linear-gradient(135deg, #fca5a5, #dc2626); color: #fff; width: 52px; height: 52px; }

    body.hud-collapsed .hud-right .customizer-grid,
    body.hud-collapsed .moves-dock .moves-grid {
      display: none !important;
    }
    @media (max-width: 960px), (max-height: 580px) {
      .hud-top > .hud-card:first-child { transform: scale(0.76); transform-origin: top left; }
      .hud-right { transform: scale(0.74); transform-origin: top right; }
      .moves-dock { padding: 4px 7px; }
      .moves-grid { max-height: 48px; }
    }
  </style>
</head>

      playTone(freq, dur, type = 'sine', gainVal = 0.08) {
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, now);
        g.gain.setValueAtTime(gainVal, now);
        g.gain.exponentialRampToValueAtTime(0.001, now + dur);
        osc.connect(g);
        g.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + dur);
      }
      playDrum(freq, dur, gainVal) {
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq * 2.2, now);
        osc.frequency.exponentialRampToValueAtTime(freq * 0.5, now + dur);
        g.gain.setValueAtTime(gainVal, now);
        g.gain.exponentialRampToValueAtTime(0.001, now + dur);
        osc.connect(g);
        g.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + dur);
      }
      playMoveSFX(moveId) {
        this.init();
        if (!this.ctx) return;
        if (moveId === 1) {
          this.playTone(340, 0.12, 'sine', 0.12);
          setTimeout(() => this.playTone(680, 0.16, 'triangle', 0.12), 45);
        } else if (moveId === 2) {
          this.playDrum(115, 0.22, 0.26);
          this.playTone(490, 0.12, 'sawtooth', 0.11);
        } else {
          this.playDrum(95 + (moveId * 9) % 120, 0.18, 0.18);
        }
      }
    }

    function drawHeroSprite(ctx, x, groundY, z, yOffset, facing, pose, fx, alpha = 1.0, isGhost = false) {
      const img = pose === 'kick' ? ASSETS.hero_kick : (pose === 'dodge' ? ASSETS.hero_dodge : ASSETS.hero_ready);
      if (!img || !img.complete || img.naturalWidth === 0) return;

      const t = performance.now() * 0.008;
      const targetH = Math.min(200, Math.max(148, canvas.height * 0.27));
      const scale = targetH / img.naturalHeight;
      const drawW = img.naturalWidth * scale;
      const drawH = targetH;

      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.translate(x, groundY + z - yOffset);

      // Ground contact shadow
      if (!isGhost) {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.48)';
        ctx.beginPath();
        ctx.ellipse(0, yOffset, drawW * 0.36, 12, 0, 0, Math.PI * 2);
        ctx.fill();
      }

      // Dynamic martial arts squash & stretch / tremble / spin!
      let sx = facing;
      let sy = 1.0;
      let rot = 0;
      let ox = 0;

      if (fx === 'shake_burst') {
        ox = Math.sin(t * 18) * 10;
        sx *= 1.06;
        sy = 0.94;
      } else if (fx === 'low_slide') {
        sy = 0.72;
        sx *= 1.18;
      } else if (fx === 'spin') {
        sx *= Math.cos(t * 6) >= 0 ? 1 : -1;
      } else if (fx === 'charge') {
        rot = facing * 0.22;
      } else if (pose === 'ready') {
        // Subtle martial breathing bounce
        sy = 1.0 + Math.sin(t * 0.9) * 0.025;
        sx *= 1.0 - Math.sin(t * 0.9) * 0.015;
      }

      ctx.translate(ox, 0);
      ctx.rotate(rot);
      ctx.scale(sx, sy);

      if (isGhost) {
        ctx.filter = 'hue-rotate(175deg) brightness(1.45) saturate(2.5)';
      }

      ctx.drawImage(img, -drawW * 0.5, -drawH + 6, drawW, drawH);
      ctx.filter = 'none';

      // Custom Uploaded Photo Head Overlay (if user uploaded their own face!)
      if (state.customHeadImg && !isGhost) {
        const headY = pose === 'kick' ? -drawH * 0.74 : (pose === 'dodge' ? -drawH * 0.72 : -drawH * 0.80);
        const headX = pose === 'kick' ? -drawW * 0.14 : (pose === 'dodge' ? drawW * 0.03 : 0);
        const headR = drawH * 0.14;
        ctx.save();
        ctx.beginPath();
        ctx.arc(headX, headY, headR, 0, Math.PI * 2);
        ctx.clip();
        ctx.drawImage(state.customHeadImg, headX - headR, headY - headR, headR * 2, headR * 2);
        ctx.restore();
        ctx.strokeStyle = '#f59e0b';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.arc(headX, headY, headR, 0, Math.PI * 2);
        ctx.stroke();
      }

      // Golden Crescent Kick Wave VFX (浪子踢球金色半月脚风)
      if (!isGhost && (fx === 'crescent_kick' || fx === 'ultimate')) {
        ctx.strokeStyle = '#fef08a';
        ctx.lineWidth = 7;
        ctx.shadowColor = '#f59e0b';
        ctx.shadowBlur = 18;
        ctx.beginPath();
        ctx.arc(drawW * 0.15, -drawH * 0.55, drawH * 0.52, -1.25, 0.55);
        ctx.stroke();
        ctx.shadowBlur = 0;
      }

      // Golden Qi Beam VFX (仙人指路贯穿剑气)
      if (!isGhost && fx === 'beam') {
        const grad = ctx.createLinearGradient(20, 0, 520, 0);
        grad.addColorStop(0, '#fef08a');
        grad.addColorStop(0.5, '#38bdf8');
        grad.addColorStop(1, 'rgba(56,189,248,0)');
        ctx.fillStyle = grad;
        ctx.fillRect(20, -drawH * 0.62, 520, 22);
      }

      ctx.restore();
    }

    function drawDinoSprite(ctx, d, t) {
      const spriteMap = {
        trex: ASSETS.dino_trex,
        raptor: ASSETS.dino_raptor,
        triceratops: ASSETS.dino_triceratops,
        pteranodon: ASSETS.dino_pteranodon,
      };
      const img = spriteMap[d.kind];
      if (!img || !img.complete || img.naturalWidth === 0) return;

      const baseH = d.kind === 'trex' ? 235 : (d.kind === 'triceratops' ? 160 : (d.kind === 'pteranodon' ? 140 : 145));
      const scaleFactor = Math.min(1.1, Math.max(0.76, canvas.height / 760));
      const drawH = baseH * scaleFactor;
      const drawW = (img.naturalWidth / img.naturalHeight) * drawH;
      const flyLift = d.kind === 'pteranodon' ? 88 + Math.sin(t * 7 + d.seed) * 16 : 0;

      ctx.save();
      ctx.translate(d.x, d.groundY + d.z - d.y - flyLift);

      // Red Danger Attack Telegraph Circle on Floor
      if (d.attackWindup > 0 && d.y <= 1) {
        ctx.save();
        ctx.translate(0, flyLift);
        ctx.fillStyle = `rgba(239, 68, 68, ${0.22 + d.attackWindup * 0.45})`;
        ctx.strokeStyle = '#ef4444';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.ellipse(0, 0, drawW * 0.38, 18, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = '#fef08a';
        ctx.font = 'bold 12px "Microsoft YaHei"';
        ctx.textAlign = 'center';
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 3;
        ctx.strokeText('⚠️ 恐龙扑咬！快按【闪身步】！', 0, 24);
        ctx.fillText('⚠️ 恐龙扑咬！快按【闪身步】！', 0, 24);
        ctx.restore();
      }

      // Floor Shadow
      ctx.fillStyle = 'rgba(0, 0, 0, 0.44)';
      ctx.beginPath();
      ctx.ellipse(0, d.y + flyLift, drawW * 0.34, 12, 0, 0, Math.PI * 2);
      ctx.fill();

      // Flying Spin when kicked by Langzi Tiqiu!
      if (d.rotation !== 0) {
        ctx.translate(0, -drawH * 0.5);
        ctx.rotate(d.rotation);
        ctx.translate(0, drawH * 0.5);
      }

      // Running Gait Squash & Bobbing
      const bob = Math.abs(Math.sin(t * 8 + d.seed)) * (d.kind === 'pteranodon' ? 4 : 9);
      const tilt = Math.sin(t * 8 + d.seed) * 0.045;
      ctx.save();
      ctx.translate(0, -bob);
      ctx.rotate(tilt);
      ctx.scale(d.facing, 1);

      if (d.hitFlash > 0) {
        ctx.filter = 'brightness(2.6) contrast(1.4)';
      }
      ctx.drawImage(img, -drawW * 0.5, -drawH + 8, drawW, drawH);
      ctx.filter = 'none';
      ctx.restore();

      // Dinosaur HP Bar & Name Label
      const barY = -drawH - 12;
      const barW = d.kind === 'trex' ? 112 : 68;
      ctx.fillStyle = 'rgba(0, 0, 0, 0.78)';
      ctx.fillRect(-barW * 0.5, barY, barW, 7);
      ctx.fillStyle = d.kind === 'trex' ? '#ef4444' : '#22c55e';
      ctx.fillRect(-barW * 0.5, barY, barW * Math.max(0, d.hp / d.maxHp), 7);
      ctx.font = 'bold 11px "Microsoft YaHei"';
      ctx.textAlign = 'center';
      ctx.strokeStyle = '#000';
      ctx.lineWidth = 3;
      ctx.strokeText(d.label, 0, barY - 4);
      ctx.fillStyle = d.kind === 'trex' ? '#fca5a5' : '#fef08a';
      ctx.fillText(d.label, 0, barY - 4);

      ctx.restore();
    }

    function executeMove(moveId) {

      if (move.id === 30) {
        for (let k = 0; k < 8; k++) {
          hero.afterimages.push({
            x: 110 + (k / 7) * (canvas.width - 220),

      for (let i = dinos.length - 1; i >= 0; i--) {

          d.hp -= dmg;
          d.hitFlash = 0.14;
          d.attackWindup = 0;

          const dir = d.x >= hero.x ? 1 : -1;

          floatingTexts.push({

            color: move.id >= 21 ? '#fb7185' : '#fef08a',

      const rect = joyZone.getBoundingClientRect();

      let dx = e.clientX - (rect.left + rect.width * 0.5);

      const dist = Math.hypot(dx, dy);
      if (dist > maxR) { dx = (dx / dist) * maxR; dy = (dy / dist) * maxR; }
      joyKnob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;

    const AUTO_SEQUENCE = [1, 2, 3, 13, 2, 11, 12, 16, 19, 23, 24, 27, 30, 4, 5, 10, 14, 18, 20, 28, 29];

    function drawBackground(ctx, w, h, groundY) {
      const bgImg = state.sceneMode === 'dance_studio' ? ASSETS.bg_dance_studio : ASSETS.bg_jurassic_jungle;
      if (bgImg && bgImg.complete && bgImg.naturalWidth > 0) {
        // Aspect-cover draw so background fills any screen aspect cleanly without distortion
        const scale = Math.max(w / bgImg.naturalWidth, h / bgImg.naturalHeight);
        const dw = bgImg.naturalWidth * scale;
        const dh = bgImg.naturalHeight * scale;
        ctx.drawImage(bgImg, (w - dw) * 0.5, (h - dh) * 0.5, dw, dh);
      } else {
        ctx.fillStyle = '#1c1917';
        ctx.fillRect(0, 0, w, h);
      }

      // Subtle mirror reflection in Dance Studio mode
      if (state.sceneMode === 'dance_studio') {
        ctx.save();
        ctx.beginPath();
        ctx.rect(w * 0.28, h * 0.22, w * 0.44, h * 0.44);
        ctx.clip();
        drawHeroSprite(ctx, hero.x, h * 0.64, 0, hero.y * 0.5, hero.facing, hero.pose, 'none', 0.24, false);
        ctx.restore();
      }
    }

    function loop(now) {
      requestAnimationFrame(loop);
      const rawDt = Math.min((now - lastTime) / 1000, 0.1);
      lastTime = now;
      const t = now * 0.001;

      fpsFrames++;
      fpsTimer += rawDt;
      if (fpsTimer >= 0.5) {
        state.fps = Math.min(60, Math.round(fpsFrames / fpsTimer));
        document.getElementById('fps-val').textContent = state.fps + ' OK';
        fpsFrames = 0;
        fpsTimer = 0;
      }

      if (state.hitstopRemaining > 0) {
        state.hitstopRemaining -= rawDt * 1000;
        return;
      }

      if (state.witchTimeTimer > 0) state.witchTimeTimer = Math.max(0, state.witchTimeTimer - rawDt);
      const dinoDt = state.witchTimeTimer > 0 ? rawDt * 0.25 : rawDt;
      const dt = rawDt;

      const w = canvas.width;
      const h = canvas.height;
      const groundY = Math.max(250, h - 135);

      if (hero.poseTimer > 0) {
        hero.poseTimer -= dt;
        if (hero.poseTimer <= 0) { hero.pose = 'ready'; hero.fx = 'none'; }
      }
      if (hero.iframeTimer > 0) hero.iframeTimer -= dt;

      if (hero.y > 0 || hero.vy > 0) {
        hero.y += hero.vy * dt;
        hero.vy -= 1150 * dt;
        if (hero.y <= 0) { hero.y = 0; hero.vy = 0; }
      }

      let mx = joyVecX, mz = joyVecZ;
      if (keys['KeyA'] || keys['ArrowLeft']) mx -= 1;
      if (keys['KeyD'] || keys['ArrowRight']) mx += 1;
      if (keys['KeyW'] || keys['ArrowUp']) mz -= 1;
      if (keys['KeyS'] || keys['ArrowDown']) mz += 1;

      let nearest = null;
      let minDist = 99999;
      dinos.forEach(d => {
        const dist = Math.hypot(d.x - hero.x, d.z - hero.z);
        if (dist < minDist) { minDist = dist; nearest = d; }
      });

      if (mx === 0 && mz === 0 && state.autoBot && nearest) {
        const dx = nearest.x - hero.x;
        const dz = nearest.z - hero.z;
        hero.facing = dx >= 0 ? 1 : -1;
        if (Math.abs(dx) > 165) mx = dx > 0 ? 1 : -1;
        if (Math.abs(dz) > 20) mz = dz > 0 ? 0.65 : -0.65;

        autoBotTimer -= dt;
        if (autoBotTimer <= 0) {
          if (nearest.attackWindup > 0.15) {
            executeMove(Math.random() < 0.55 ? 1 : 2);
          } else if (Math.abs(dx) < 235) {
            executeMove(AUTO_SEQUENCE[autoMoveIdx % AUTO_SEQUENCE.length]);
            autoMoveIdx++;
          }
          autoBotTimer = 0.9;
        }
      } else if (mx !== 0) {
        hero.facing = mx > 0 ? 1 : -1;
      }

      hero.x = Math.max(80, Math.min(w - 80, hero.x + mx * 280 * dt));
      hero.z = Math.max(-45, Math.min(45, hero.z + mz * 160 * dt));

      // Update Dinosaurs
      for (let i = dinos.length - 1; i >= 0; i--) {
        const d = dinos[i];
        d.groundY = groundY;
        if (d.hitFlash > 0) d.hitFlash = Math.max(0, d.hitFlash - dt);

        if (d.y > 0 || d.vy > 0 || Math.abs(d.vx) > 10) {
          d.x += d.vx * dt;
          d.y += d.vy * dt;
          d.vy -= 980 * dt;
          d.vx *= 0.95;
          d.rotation += d.vRot * dt;
          if (d.y <= 0) {
            d.y = 0; d.vy = 0; d.vx = 0; d.rotation = 0; d.vRot = 0;
            if (d.hp <= 0) {
              dinos.splice(i, 1);
              state.kills++;
              state.score += d.kind === 'trex' ? 1200 : 200;
              if (state.kills % 6 === 0) state.wave++;
              spawnDino();
              if (dinos.length < 4) spawnDino();
              continue;
            }
          }
          continue;
        }

        if (d.hp <= 0) {
          dinos.splice(i, 1);
          state.kills++;
          spawnDino();
          continue;
        }

        const dx = hero.x - d.x;
        const dz = hero.z - d.z;
        d.facing = dx >= 0 ? 1 : -1;
        if (Math.abs(dx) > 115) d.x += Math.sign(dx) * d.speed * dinoDt;
        if (Math.abs(dz) > 12) d.z += Math.sign(dz) * (d.speed * 0.45) * dinoDt;

        if (Math.abs(dx) <= 145 && Math.abs(dz) <= 48) {
          d.attackWindup += dinoDt;
          if (d.attackWindup >= 0.72) {
            d.attackWindup = 0;
            if (hero.iframeTimer <= 0) {
              state.hp = Math.max(20, state.hp - (d.kind === 'trex' ? 16 : 8));
              state.shakeTimer = 0.2;
              state.shakeIntensity = 9;
              floatingTexts.push({ x: hero.x, y: hero.z - 135, text: '🦖 被恐龙咬中! 快按【闪身步】!', color: '#ef4444', life: 0.9 });
            }
          }
        } else {
          d.attackWindup = Math.max(0, d.attackWindup - dinoDt);
        }
      }

      // Render Scene
      ctx.save();
      if (state.shakeTimer > 0) {
        state.shakeTimer -= dt;
        ctx.translate((Math.random() - 0.5) * state.shakeIntensity, (Math.random() - 0.5) * state.shakeIntensity);
      }

      drawBackground(ctx, w, h, groundY);

      if (state.witchTimeTimer > 0) {
        ctx.fillStyle = 'rgba(30, 27, 75, 0.30)';
        ctx.fillRect(0, 0, w, h);
      }

      // Afterimages
      for (let i = hero.afterimages.length - 1; i >= 0; i--) {
        const a = hero.afterimages[i];
        a.life -= dt;
        if (a.life <= 0) { hero.afterimages.splice(i, 1); continue; }
        drawHeroSprite(ctx, a.x, groundY, a.z, a.y, a.facing, a.pose, 'none', a.life * 0.72, true);
      }

      // Depth-sorted 2.5D entities
      const renderList = [
        { type: 'hero', z: hero.z },
        ...dinos.map(d => ({ type: 'dino', z: d.z, ref: d }))
      ].sort((a, b) => a.z - b.z);

      renderList.forEach(item => {
        if (item.type === 'hero') {
          drawHeroSprite(ctx, hero.x, groundY, hero.z, hero.y, hero.facing, hero.pose, hero.fx, 1.0, false);
        } else {
          drawDinoSprite(ctx, item.ref, t);
        }
      });

      // Impact Shockwaves
      for (let i = slashEffects.length - 1; i >= 0; i--) {
        const s = slashEffects[i];
        s.radius += dt * 340;
        if (s.radius >= s.maxRadius) { slashEffects.splice(i, 1); continue; }
        ctx.strokeStyle = s.color;
        ctx.lineWidth = 4.5;
        ctx.globalAlpha = 1 - s.radius / s.maxRadius;
        ctx.beginPath();
        ctx.arc(s.x, groundY + s.y, s.radius, 0, Math.PI * 2);
        ctx.stroke();
        ctx.globalAlpha = 1;
      }

      // Floating Texts
      for (let i = floatingTexts.length - 1; i >= 0; i--) {
        const ft = floatingTexts[i];
        ft.life -= dt;
        ft.y -= 48 * dt;
        if (ft.life <= 0) { floatingTexts.splice(i, 1); continue; }
        ctx.save();
        ctx.globalAlpha = Math.min(1, ft.life * 1.5);
        ctx.font = '900 16px "Microsoft YaHei"';
        ctx.fillStyle = ft.color;
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 4;
        ctx.textAlign = 'center';
        ctx.strokeText(ft.text, ft.x, groundY + ft.y);
        ctx.fillText(ft.text, ft.x, groundY + ft.y);
        ctx.restore();
      }

      // Clean Auto-Sized Move Calligraphy Banner (Never clips text!)
      if (state.bannerTimer > 0) {
        state.bannerTimer -= dt;
        const bannerY = Math.max(102, h * 0.22);
        ctx.save();
        ctx.globalAlpha = Math.min(1, state.bannerTimer * 2.2);
        ctx.font = 'bold 11.5px "Microsoft YaHei"';
        const subW = ctx.measureText(state.bannerSub).width;
        const boxW = Math.min(w - 40, Math.max(360, subW + 44));
        ctx.fillStyle = 'rgba(154, 52, 18, 0.86)';
        ctx.strokeStyle = '#f59e0b';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.roundRect(w * 0.5 - boxW * 0.5, bannerY - 24, boxW, 50, 10);
        ctx.fill();
        ctx.stroke();

        ctx.font = '900 18px "Microsoft YaHei"';
        ctx.fillStyle = '#fef08a';
        ctx.textAlign = 'center';
        ctx.fillText(state.bannerText, w * 0.5, bannerY - 2);

        ctx.font = 'bold 11.5px "Microsoft YaHei"';
        ctx.fillStyle = '#e0f2fe';
        ctx.fillText(state.bannerSub, w * 0.5, bannerY + 17);
        ctx.restore();
      }

      ctx.restore();

      document.getElementById('hp-bar').style.width = ((state.hp / state.maxHp) * 100) + '%';
      document.getElementById('hp-text').textContent = Math.round(state.hp) + '/' + state.maxHp;
      document.getElementById('kills-val').textContent = state.kills;
      state.framesRendered++;
    }

    requestAnimationFrame(loop);
  </script>
</body>
</html>
